name: Deploy site to GitHub Pages

# Deploys the static site on every push to the default branch.
# No build step — the repo IS the site, so we just upload it as the Pages artifact.

on:
  push:
    branches: [main, master]   # works whichever name the repo's default branch uses
  workflow_dispatch:            # lets you trigger a deploy manually from the Actions tab

# Permissions the deploy job needs to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root (index.html, assets/, CNAME, .nojekyll).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
