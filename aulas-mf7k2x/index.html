<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A Subida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">

<style>
  :root{
    /* ---- paisagem chilena ---- */
    --pacifico:#0FB5BD;
    --pacifico-2:#0A8A91;
    --valle:#6BCB4F;
    --valle-2:#4EA336;
    --sol:#FFC233;
    --sol-2:#E09A00;
    --cobre:#F2682A;
    --cobre-2:#C94A12;
    --andino:#8B4FB5;
    --andino-2:#6B2F93;
    --nieve:#FFFFFF;
    --cielo:#E6F4FF;
    --cielo-2:#C9E8FB;

    --ground:#F2FAFE;
    --card:#FFFFFF;
    --ink:#16304F;
    --ink-2:#4A6886;
    --ink-3:#7E97B0;
    --line:#CDE4F2;
    --sombra:0 2px 6px -2px rgba(22,48,79,.10), 0 14px 32px -14px rgba(22,48,79,.30), 0 30px 60px -36px rgba(22,48,79,.24);
    --sombra-sm:0 1px 4px -1px rgba(22,48,79,.08), 0 8px 20px -10px rgba(22,48,79,.26);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0B1A2E;
      --card:#13263E;
      --ink:#E8F4FF;
      --ink-2:#A6C2DC;
      --ink-3:#6F8CA8;
      --line:#214063;
      --cielo:#122744;
      --cielo-2:#0D1E36;
      --nieve:#DCEEFB;
      --sombra:0 2px 6px -2px rgba(0,0,0,.4), 0 14px 32px -14px rgba(0,0,0,.55), 0 30px 60px -36px rgba(0,0,0,.6);
      --sombra-sm:0 1px 4px -1px rgba(0,0,0,.35), 0 8px 20px -10px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B1A2E; --card:#13263E; --ink:#E8F4FF; --ink-2:#A6C2DC; --ink-3:#6F8CA8;
    --line:#214063; --cielo:#122744; --cielo-2:#0D1E36; --nieve:#DCEEFB;
    --sombra:0 2px 6px -2px rgba(0,0,0,.4), 0 14px 32px -14px rgba(0,0,0,.55), 0 30px 60px -36px rgba(0,0,0,.6);
    --sombra-sm:0 1px 4px -1px rgba(0,0,0,.35), 0 8px 20px -10px rgba(0,0,0,.5);
  }

  /* textura discreta: grão suave sobre o fundo e sobre a paisagem */
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.4;
    background-image:radial-gradient(circle at 1px 1px, rgba(22,48,79,.055) 1px, transparent 0);
    background-size:22px 22px;
  }
  :root:not([data-theme="light"]) body::before{background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0)}
  .pagina,#nuvens,.cortina{position:relative; z-index:1}

  *{box-sizing:border-box}
  body{
    background:var(--ground); color:var(--ink);
    font-family:Nunito, system-ui, -apple-system, sans-serif;
    font-size:16px; line-height:1.55; margin:0;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.fk{font-family:Fredoka, Nunito, sans-serif; font-weight:600; margin:0}
  .pagina{max-width:1180px; margin:0 auto; padding:clamp(1.1rem,3vw,2.2rem) clamp(.9rem,3vw,2rem) 5rem}

  /* ---------------- cabeçalho ---------------- */
  .topo{display:flex; flex-wrap:wrap; align-items:center; gap:1rem 1.4rem; margin-bottom:1.6rem}
  .marca{display:flex; align-items:center; gap:.85rem}
  .marca .emblema{
    width:62px; height:62px; border-radius:22px; flex:none;
    background:linear-gradient(145deg,var(--sol),var(--cobre));
    display:grid; place-items:center; box-shadow:var(--sombra-sm);
  }
  .marca .emblema svg{width:38px; height:38px}
  .marca h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem); line-height:1; font-weight:700}
  .marca p{margin:.15rem 0 0; color:var(--ink-2); font-weight:700; font-size:.92rem}
  .ver-filme{
    margin-left:auto; display:flex; align-items:center; gap:.7rem; text-decoration:none;
    background:linear-gradient(145deg,#12304B,#0B1F33); color:#EAF4FB;
    border-radius:100px; padding:.45rem 1.1rem .45rem .5rem; box-shadow:var(--sombra-sm);
    transition:transform .18s cubic-bezier(.34,1.5,.64,1), box-shadow .18s;
  }
  .ver-filme:hover{transform:translateY(-2px); box-shadow:var(--sombra)}
  .ver-filme .pl{width:34px;height:34px;border-radius:50%;flex:none;
    background:linear-gradient(145deg,var(--sol),var(--cobre)); color:#fff;
    display:grid;place-items:center; font-size:.8rem; padding-left:2px}
  .ver-filme b{display:block; font-family:Fredoka; font-weight:600; font-size:.88rem; line-height:1.15}
  .ver-filme small{display:block; font-size:.74rem; color:#9FC0DC; font-weight:700}
  @media (max-width:640px){ .ver-filme{margin-left:0; order:3} }

  .contador{
    margin-left:0; display:flex; align-items:center; gap:.6rem;
    background:var(--card); border:2px solid var(--line); border-radius:100px;
    padding:.45rem .5rem .45rem 1rem; box-shadow:var(--sombra-sm); font-weight:800; font-size:.92rem;
  }
  .contador b{font-family:Fredoka; font-size:1.15rem; color:var(--cobre)}
  .contador .pips{display:flex; gap:4px}
  .contador .pip{width:11px; height:11px; border-radius:50%; background:var(--line)}
  .contador .pip.on{background:var(--valle)}

  /* ---------------- antes de subir ---------------- */
  .faixa-titulo{display:flex; align-items:center; gap:.7rem; margin:2rem 0 .9rem}
  .faixa-titulo h2{font-size:1.3rem; font-weight:700}
  .faixa-titulo .risco{flex:1; height:5px; border-radius:3px; background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 24px)}

  .temporadas{display:flex; gap:.5rem; flex-wrap:wrap; margin:1.6rem 0 0}
  .tmp{
    font:inherit; font-family:Fredoka; font-weight:600; font-size:.95rem; cursor:pointer;
    border:2px solid var(--line); background:var(--card); color:var(--ink-2);
    border-radius:100px; padding:.58rem 1.25rem; display:flex; align-items:center; gap:.5rem;
    transition:border-color .2s, color .2s, background .2s, transform .16s;
  }
  .tmp:hover{transform:translateY(-2px); border-color:var(--tc); color:var(--tc)}
  .tmp:focus-visible{outline:3px solid var(--tc); outline-offset:2px}
  .tmp[aria-selected="true"]{background:var(--tc); border-color:var(--tc); color:#fff}
  .tmp .bandeira{width:20px;height:14px;border-radius:3px;flex:none;overflow:hidden;display:block}
  .tmp em{font-style:normal; font-size:.76rem; opacity:.75; font-weight:500}
  .tmp .tag-prep{font-size:.7rem; background:var(--sol); color:#4A3200; border-radius:100px;
    padding:.1rem .5rem; font-weight:600}
  .tmp[aria-selected="true"] .tag-prep{background:rgba(255,255,255,.3); color:#fff}

  .base{display:grid; grid-template-columns:repeat(3,1fr); gap:1rem}
  @media (max-width:760px){ .base{grid-template-columns:1fr} }
  .mochila{
    position:relative; text-align:left; cursor:pointer; font:inherit; color:inherit;
    background:var(--card); border:2px solid var(--line); border-radius:30px;
    padding:1.1rem 1.1rem 1.2rem; box-shadow:var(--sombra-sm);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .18s;
  }
  .mochila:hover,.mochila:focus-visible{transform:translateY(-6px); border-color:var(--c); box-shadow:var(--sombra); outline:none}
  .mochila:active{transform:translateY(-1px)}
  .mochila .selo{
    width:52px; height:52px; border-radius:17px; display:grid; place-items:center;
    background:var(--c); margin-bottom:.7rem; box-shadow:0 6px 16px -6px rgba(0,0,0,.3);
  }
  .mochila .selo svg{width:30px;height:30px;color:#fff}
  .mochila .etq{font-family:Fredoka; font-size:.78rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--c)}
  .mochila h3{font-size:1.06rem; line-height:1.25; margin:.2rem 0 .35rem; font-weight:600}
  .mochila p{margin:0; font-size:.88rem; color:var(--ink-2); font-weight:600}

  /* ---------------- a montanha ---------------- */
  .montanha{
    position:relative; margin-top:.4rem;
    background:linear-gradient(180deg,var(--cielo),var(--cielo-2));
    border:2px solid var(--line); border-radius:40px; box-shadow:var(--sombra);
    overflow:hidden;
  }
  .montanha svg{display:block; width:100%; height:auto}
  .legenda-alt{
    position:absolute; left:0; top:0; bottom:0; width:74px; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between; padding:1.1rem .6rem 2.6rem;
    font-family:Fredoka; font-size:.76rem; font-weight:600; color:var(--ink-3);
  }
  @media (max-width:620px){ .legenda-alt{display:none} }

  /* estações */
  .estacao{cursor:pointer}
  .estacao .halo{transform-box:fill-box; transform-origin:center; transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .25s; opacity:0}
  .estacao:hover .halo,.estacao:focus-visible .halo{opacity:.35; transform:scale(1.5)}
  .estacao .bolha{transform-box:fill-box; transform-origin:center; transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
  .estacao:hover .bolha,.estacao:focus-visible .bolha{transform:scale(1.12)}
  .estacao:focus-visible{outline:none}
  .estacao:focus-visible .bolha{stroke:var(--ink); stroke-width:5}
  .estacao .rot{font-family:Fredoka; font-weight:600; pointer-events:none}
  .estacao .alt{font-family:Fredoka; font-weight:500; pointer-events:none}
  .estacao.vista .bolha{filter:saturate(1)}

  /* pontos de curiosidade */
  .curio{cursor:pointer}
  .curio circle{transition:transform .2s cubic-bezier(.34,1.56,.64,1); transform-box:fill-box; transform-origin:center}
  .curio:hover circle,.curio:focus-visible circle{transform:scale(1.25)}
  .curio:focus-visible{outline:none}
  .curio text{font-family:Fredoka; font-weight:600; pointer-events:none}

  /* ---------------- nuvens de curiosidade ---------------- */
  #nuvens{position:fixed; inset:0; pointer-events:none; z-index:60}
  .nuvem{
    position:absolute; max-width:min(330px,78vw);
    background:var(--card); color:var(--ink);
    border:4px solid var(--c,var(--sol)); border-radius:34px;
    padding:.95rem 1.2rem; font-weight:700; font-size:.95rem; line-height:1.4;
    box-shadow:var(--sombra); transform:translate(-50%,0);
    animation:sobe 5.4s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .nuvem::before,.nuvem::after{
    content:""; position:absolute; border-radius:50%;
    background:var(--card); border:4px solid var(--c,var(--sol));
  }
  .nuvem::before{width:26px;height:26px; left:28px; bottom:-18px}
  .nuvem::after{width:14px;height:14px; left:16px; bottom:-34px}
  .nuvem .q{display:block; font-family:Fredoka; font-size:.76rem; font-weight:600;
            letter-spacing:.1em; text-transform:uppercase; color:var(--c,var(--sol)); margin-bottom:.15rem}
  @keyframes sobe{
    0%{opacity:0; transform:translate(-50%,10px) scale(.7)}
    12%{opacity:1; transform:translate(-50%,-6px) scale(1.04)}
    18%{transform:translate(-50%,0) scale(1)}
    78%{opacity:1; transform:translate(-50%,-78px) scale(1)}
    100%{opacity:0; transform:translate(-50%,-128px) scale(.97)}
  }
  @media (prefers-reduced-motion:reduce){
    .nuvem{animation:surge .3s ease-out forwards}
    @keyframes surge{from{opacity:0}to{opacity:1}}
    *{transition-duration:.01ms !important}
  }

  /* ---------------- painel da aula ---------------- */
  .cortina{
    position:fixed; inset:0; z-index:70; display:none;
    background:rgba(11,26,46,.62); backdrop-filter:blur(4px);
    padding:clamp(.8rem,3vw,2rem); overflow-y:auto;
  }
  .cortina.abre{display:grid; place-items:start center}
  .aula{
    width:min(880px,100%); background:var(--card);
    border:0; border-radius:34px;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.7); overflow:hidden;
    animation:entra .34s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes entra{from{opacity:0; transform:translateY(22px) scale(.97)} to{opacity:1; transform:none}}
  .aula-topo{display:flex; align-items:flex-start; gap:1rem; padding:1.2rem 1.3rem .9rem; background:var(--c)}
  .aula-topo .n{
    width:66px;height:66px;flex:none;border-radius:22px;background:rgba(255,255,255,.26);
    display:grid;place-items:center;font-family:Fredoka;font-weight:600;color:#fff;line-height:1;
  }
  .aula-topo .n b{display:block;font-size:1.5rem}
  .aula-topo .n span{display:block;font-size:.66rem;letter-spacing:.06em}
  .aula-topo h2{color:#fff; font-size:clamp(1.15rem,1rem + .9vw,1.6rem); line-height:1.2; font-weight:700}
  .aula-topo .local{color:rgba(255,255,255,.92); font-weight:800; font-size:.84rem; margin:.25rem 0 0}
  .fechar{
    margin-left:auto; flex:none; width:44px;height:44px;border-radius:50%;
    border:3px solid rgba(255,255,255,.55); background:rgba(255,255,255,.2); color:#fff;
    font-size:1.3rem; cursor:pointer; line-height:1; display:grid; place-items:center;
  }
  .fechar:hover{background:rgba(255,255,255,.34)}
  .fechar:focus-visible{outline:3px solid #fff; outline-offset:2px}

  .tela{position:relative; aspect-ratio:16/9; background:#0B1A2E; display:grid; place-items:center}
  .tela video,.tela iframe{width:100%;height:100%;display:block;border:0}
  .vazio{text-align:center; color:#9FC0DC; padding:1.4rem}
  .vazio .ico{width:72px;height:72px;margin:0 auto .6rem; border-radius:26px;
    background:rgba(255,255,255,.08); display:grid; place-items:center}
  .vazio .ico svg{width:38px;height:38px}
  .vazio b{display:block; font-family:Fredoka; font-size:1.05rem; color:#CFE6F7; font-weight:600}
  .vazio code{font-size:.82rem; background:rgba(255,255,255,.1); padding:.15rem .45rem; border-radius:6px}

  .tela .foto{width:100%; height:100%; object-fit:cover; display:block}
  .selo-prov{
    position:absolute; left:14px; top:14px; display:flex; align-items:center; gap:.5rem;
    background:rgba(11,26,46,.78); color:#EAF6FF; backdrop-filter:blur(6px);
    padding:.4rem .85rem .4rem .7rem; border-radius:100px;
    font-family:Fredoka; font-size:.78rem; font-weight:500;
  }
  .selo-prov .pulso{width:9px;height:9px;border-radius:50%;background:var(--sol);
    box-shadow:0 0 0 0 rgba(255,194,51,.7); animation:bate 2s infinite}
  @keyframes bate{70%{box-shadow:0 0 0 9px rgba(255,194,51,0)}100%{box-shadow:0 0 0 0 rgba(255,194,51,0)}}
  .credito{
    position:absolute; left:0; right:0; bottom:0; padding:.5rem .9rem;
    background:linear-gradient(0deg,rgba(11,26,46,.85),transparent);
    color:#C8DDEF; font-size:.68rem; font-weight:600; line-height:1.3;
  }
  @media (prefers-reduced-motion:reduce){ .selo-prov .pulso{animation:none} }



  /* ---------- galeria do arquivo pessoal ---------- */
  .arquivo{margin:0 0 1.1rem}
  .arquivo-cab{display:flex; align-items:center; gap:.55rem; margin-bottom:.6rem}
  .arquivo-cab .pt{width:9px;height:9px;border-radius:50%;background:var(--valle);flex:none;
    box-shadow:0 0 0 0 rgba(107,203,79,.6); animation:pulsa 2.4s infinite}
  @keyframes pulsa{70%{box-shadow:0 0 0 8px rgba(107,203,79,0)}100%{box-shadow:0 0 0 0 rgba(107,203,79,0)}}
  .arquivo-cab b{font-family:Fredoka; font-weight:600; font-size:.9rem}
  .arquivo-cab span{font-size:.8rem; color:var(--ink-3); font-weight:700}
  .tiras{display:flex; gap:.6rem; overflow-x:auto; padding:.15rem .15rem .6rem; scroll-snap-type:x mandatory}
  .tira{
    flex:none; width:158px; scroll-snap-align:start; cursor:pointer; border:0; padding:0;
    background:none; font:inherit; color:inherit; text-align:left;
  }
  .tira .moldura{
    position:relative; width:158px; aspect-ratio:9/16; border-radius:18px; overflow:hidden;
    background:#0B1A2E; box-shadow:var(--sombra-sm); transition:transform .2s cubic-bezier(.34,1.5,.64,1);
  }
  .tira:hover .moldura,.tira:focus-visible .moldura{transform:translateY(-4px) scale(1.02)}
  .tira:focus-visible{outline:none}
  .tira:focus-visible .moldura{box-shadow:0 0 0 3px var(--pc,var(--cobre))}
  .tira video,.tira img{width:100%;height:100%;object-fit:cover;display:block}
  .tira .play{
    position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.42));
  }
  .tira .play i{
    width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);
    display:grid;place-items:center; font-style:normal; color:#16304F; font-size:.95rem; padding-left:3px;
  }
  .tira.foto .play{background:none}
  .tira.foto .play i{display:none}
  .tira .selo{
    position:absolute; left:8px; top:8px; font-family:Fredoka; font-size:.66rem; font-weight:600;
    background:rgba(11,26,46,.72); color:#DCEEFB; padding:.18rem .5rem; border-radius:100px;
  }
  .tira p{margin:.4rem .15rem 0; font-size:.78rem; font-weight:700; color:var(--ink-2); line-height:1.3}

  /* visor em tela cheia */
  .visor{position:fixed; inset:0; z-index:95; display:none; background:rgba(8,18,32,.9);
    backdrop-filter:blur(6px); place-items:center; padding:1.2rem}
  .visor.abre{display:grid}
  .visor-caixa{width:min(420px,92vw); max-height:92vh; display:flex; flex-direction:column; gap:.7rem}
  .visor video,.visor img{width:100%; max-height:76vh; object-fit:contain; border-radius:20px; display:block; background:#000}
  .visor .leg{color:#CFE3F1; font-size:.9rem; font-weight:700; text-align:center}
  .visor .cred{color:#8FAFC8; font-size:.74rem; font-weight:700; text-align:center}
  .visor .x{
    position:absolute; right:1rem; top:1rem; width:44px;height:44px;border-radius:50%;
    border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.14); color:#fff;
    font-size:1.3rem; cursor:pointer; display:grid; place-items:center;
  }
  .visor .x:hover{background:rgba(255,255,255,.26)}
  @media (prefers-reduced-motion:reduce){ .arquivo-cab .pt{animation:none} }

  /* ---------- pontos da aula ---------- */
  .passo{
    border:2px solid var(--line); border-radius:24px; overflow:hidden;
    background:var(--ground); transition:border-color .2s, box-shadow .2s;
  }
  .passo + .passo{margin-top:.7rem}
  .passo.aberto{border-color:var(--pc); box-shadow:var(--sombra-sm)}
  .passo.ok{border-color:var(--valle)}
  .passo-cab{
    width:100%; display:flex; align-items:center; gap:.8rem; text-align:left;
    font:inherit; color:inherit; cursor:pointer; background:none; border:0;
    padding:.9rem 1rem;
  }
  .passo-cab:focus-visible{outline:3px solid var(--pc); outline-offset:-3px; border-radius:22px}
  .passo-cab .bolinha{
    width:38px;height:38px;flex:none;border-radius:13px;background:var(--pc);
    display:grid;place-items:center;color:#fff;
  }
  .passo-cab .bolinha svg{width:21px;height:21px}
  .passo-cab .tx{flex:1; min-width:0}
  .passo-cab .tt{font-family:Fredoka; font-weight:600; font-size:1rem; display:block; color:var(--pc)}
  .passo-cab .rr{font-size:.88rem; color:var(--ink-2); font-weight:600; display:block; line-height:1.35}
  .passo-cab .seta{flex:none; color:var(--ink-3); transition:transform .25s; font-size:1.1rem}
  .passo.aberto .passo-cab .seta{transform:rotate(90deg)}
  .passo-cab .tick{flex:none; width:26px;height:26px;border-radius:50%;background:var(--valle);
    display:none; place-items:center; color:#fff; font-size:.85rem}
  .passo.ok .passo-cab .tick{display:grid}
  .passo.ok .passo-cab .seta{display:none}

  .passo-corpo{display:none; padding:0 1rem 1.1rem; border-top:2px dashed var(--line); margin-top:-2px; padding-top:.9rem}
  .passo.aberto .passo-corpo{display:block}
  .passo-corpo .fundo{margin:0 0 1rem; font-size:.94rem; color:var(--ink-2); font-weight:600; line-height:1.55}

  .desafio{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:.9rem 1rem}
  .desafio .pg{font-family:Fredoka; font-weight:600; font-size:1rem; margin:0 0 .7rem; color:var(--ink)}
  .ops{display:grid; gap:.5rem}
  @media (min-width:640px){ .ops{grid-template-columns:1fr 1fr} }
  .op{

var CONTEXTO = [
{ id:'c1', tag:'Antes da chegada dos europeus', cor:'var(--andino)', ico:'bussola',
  h:'Como conquistar um território sem capital?',
  sub:'O Chile antes de 1541',
  res:'Os mapuche não tinham capital, rei nem Estado central. Parece um detalhe de antropologia — e foi o que tornou impossível vencê-los do jeito que a Espanha vencera astecas e incas.',
  pontos:[
  { k:'ori', t:'Quem vivia aqui',
    r:'Nove povos, do altiplano ao fim do mundo, cada um com o modo de vida que o seu clima permitia.',
    d:'Aymara e likan antai no deserto do norte. Diaguitas nos vales. Changos pescando no litoral. Picunche no vale central, onde hoje é Santiago. Mapuche e huilliche no centro-sul. Chonos e kawésqar navegando os canais. Selk’nam, yagán e aónikenk no frio do extremo sul. E os rapa nui, a 3.700 km da costa, no meio do Pacífico.',
    q:'Por que povos tão diferentes dividiam um país só?',
    a:'Porque vieram de lugares diferentes do mundo',
    b:'Porque o Chile tem climas muito diferentes entre si',
    ok:'b',
    porque:'O Chile tem 4.300 km de norte a sul. Quem vive no deserto mais seco do mundo desenvolve um modo de vida; quem vive entre geleiras, outro. A geografia não é o cenário da história — é uma das personagens.',
    quase:'Não vieram de lugares diferentes: são povos aparentados, que se diferenciaram aqui. O que os separou foi o clima — são 4.300 km entre o deserto e o gelo.' },
  { k:'cul', t:'A organização',
    r:'A unidade era o lof, uma comunidade de famílias. Não havia pirâmide para derrubar.',
    d:'Cada lof tinha um lonko à frente. Em tempo de guerra, as comunidades escolhiam um toqui, chefe militar — e ele comandava só aquela guerra. Terminado o conflito, o poder voltava para os lof. Era uma estrutura horizontal, pensada para não depender de um centro.',
    q:'A Espanha derrubou astecas e incas tomando a capital e capturando o imperador. Por que isso não funcionou aqui?',
    a:'Porque não havia capital nem imperador para tomar',
    b:'Porque os mapuche tinham armas melhores',
    ok:'a',
    porque:'Sem centro, não há golpe decisivo. Cada lof decidia por si — derrotar um não derrotava os outros. A estratégia que derrubou dois impérios em poucos anos aqui simplesmente não tinha alvo.',
    quase:'As armas eram muito inferiores às espanholas no começo: sem cavalo, sem ferro, sem pólvora. A vantagem era organizacional, não tecnológica.' },
  { k:'lin', t:'A fala da terra',
    r:'Mapudungun = mapu (terra) + dungun (fala). Mapuche = gente da terra.',
    d:'O nome do povo e o nome da língua carregam a mesma raiz do chão onde vivem. Não é coincidência poética: é como eles se definem. Guarde a palavra — daqui a duas aulas ela reaparece dentro do espanhol que qualquer chileno fala hoje, sem perceber.',
    q:'O que "mapuche" quer dizer?',
    a:'Gente da terra',
    b:'Guerreiros do sul',
    ok:'a',
    porque:'Mapu é terra, che é gente. Um povo que se nomeia pela relação com o território — o que ajuda a entender por que a disputa por terra ainda é central para eles hoje.',
    quase:'"Guerreiros" foi como os espanhóis passaram a descrevê-los, não como eles se nomeiam. O nome próprio fala de terra, não de guerra.' },
  { k:'geo', t:'O limite do maior império',
    r:'O império inca chegou ao vale central vindo do norte — e parou.',
    d:'O Tawantinsuyu foi o maior império da América, com estradas que cruzavam milhares de quilômetros. Alcançou o Chile central com presença administrativa e caminho. Mais ao sul, não passou. Santiago não foi a primeira cidade projetada nesta bacia.',
    q:'O que o avanço inca mostra sobre a resistência que os espanhóis encontrariam?',
    a:'Que ela já havia travado um império antes',
    b:'Que os incas eram aliados dos mapuche',
    ok:'a',
    porque:'A fronteira que os espanhóis não conseguiram atravessar já tinha detido alguém. Não era despreparo europeu: era a força de quem defendia aquele território.',
    quase:'Não eram aliados — os incas tentaram avançar e foram contidos. Foi confronto, não aliança.' }]},

{ id:'c2', tag:'A colonização', cor:'var(--cobre)', ico:'espada',
  h:'Por que a conquista do Chile levou 342 anos?',
  sub:'De 1541 a 1883',
  res:'Mais tempo do que separa o Brasil da sua independência. E quem fechou a conta no fim não foi a Espanha.',
  pontos:[
  { k:'cul', t:'Duas datas em 1541',
    r:'Santiago é fundada em fevereiro e queimada em setembro.',
    d:'Pedro de Valdivia funda a cidade em 12 de fevereiro de 1541. Em 11 de setembro do mesmo ano — cinco meses depois — o toqui Michimalonco reúne os povos do Aconcágua, do Mapocho e do Cachapoal e queima Santiago inteira. A cidade é reconstruída do zero.',
    q:'Por que a segunda data quase nunca aparece nos livros?',
    a:'Porque foi um episódio pequeno, sem importância',
    b:'Porque fundações são contadas como começos, não como disputas',
    ok:'b',
    porque:'Contar só fevereiro faz a cidade parecer um presente da civilização a uma terra vazia. Contar setembro junto mostra o que de fato foi: uma invasão que encontrou resistência organizada e quase não vingou.',
    quase:'Pequeno não foi: a cidade foi destruída quase por completo e teve que ser erguida outra vez. O que o apaga não é o tamanho, é o incômodo.' },
  { k:'ori', t:'Lautaro',
    r:'Serviu no acampamento espanhol, aprendeu o cavalo, e em 1553 ajudou a derrotar Valdivia em Tucapel.',
    d:'O cavalo não existia na América antes dos europeus, e era a maior vantagem militar espanhola. Lautaro viu de perto como o animal funcionava e como lutava quem o montava. Levou esse conhecimento de volta. Na batalha de Tucapel, em 1553, Pedro de Valdivia é morto.',
    q:'O que a história de Lautaro mostra sobre a resistência mapuche?',
    a:'Que foi coragem, mas sem estratégia',
    b:'Que foi também aprendizado técnico, usado contra quem ensinou',
    ok:'b',
    porque:'Resistir não foi só enfrentar: foi estudar o adversário e virar a vantagem dele do avesso. O conquistador foi derrotado com o conhecimento que ele mesmo trouxe.',
    quase:'Houve estratégia, e sofisticada: adaptação de táticas, uso do terreno e do próprio cavalo europeu. Reduzir a bravura é apagar a inteligência.' },
  { k:'geo', t:'A fronteira do Biobío',
    r:'Em 1641 a Espanha assina um tratado: ao sul do rio, ela não manda.',
    d:'Depois de quase cem anos de Guerra de Arauco, espanhóis e mapuche se encontram à beira do rio Quillén, em 6 de janeiro de 1641. É o Parlamento de Quilín. A Coroa reconhece a liberdade mapuche em seu território e o Biobío vira fronteira. A linha atravessa o resto do período colonial.',
    q:'O que aconteceu com essa fronteira quando o Chile ficou independente, em 1818?',
    a:'Continuou exatamente onde estava',
    b:'Foi desfeita no mesmo ano',
    ok:'a',
    porque:'A república nasceu e a linha permaneceu. Por quase três séculos — colônia e império espanhol inteiros — aquele território nunca foi conquistado.',
    quase:'Não foi desfeita em 1818. Ela só cai entre 1861 e 1883, mais de quarenta anos depois da independência — e não pelas mãos da Espanha.' },
  { k:'lin', t:'A palavra escolhida',
    r:'1861–1883: o Chile independente ocupa o território. Chamaram de "Pacificação".',
    d:'Campanhas militares, uma linha de fortes avançando, e a transferência forçada das comunidades para áreas pequenas chamadas reduções. Trezentos anos de fronteira reconhecida terminam em pouco mais de vinte anos. O nome oficial do processo entrou para a história como "Pacificação da Araucanía".',
    q:'O que a palavra "pacificação" faz com a história?',
    a:'Descreve o que aconteceu com precisão',
    b:'Sugere que havia desordem e que alguém trouxe a paz',
    ok:'b',
    porque:'Pacificar pressupõe uma guerra em curso que precisava ser encerrada — e coloca quem invade no papel de quem resolve. Quem escolhe a palavra escolhe quem é o agressor. Isso vale muito além do Chile.',
    quase:'Precisão não há: foi ocupação militar de um território reconhecido por tratado. "Pacificação" é a versão de quem avançou.' }]},

{ id:'c3', tag:'O resultado', cor:'var(--valle)', ico:'mesa',
  h:'O que sobrou de cada lado dentro do Chile?',
  sub:'Língua, costume, mesa e gente',
  res:'Não existe um Chile indígena e um Chile espanhol. Existe o resultado do encontro entre os dois — e é ele que está na boca, na mesa e no chapéu de quem mora lá hoje.',
  pontos:[
  { k:'lin', t:'Cahuín',
    r:'Era a reunião da comunidade em mapudungun. No espanhol chileno, virou "fofoca".',
    d:'Kawiñ, em mapudungun, era o encontro de todo mundo: a festa coletiva, a assembleia. A palavra atravessou para o espanhol chileno e hoje significa intriga, mexerico. Quem gosta de falar da vida alheia é cahuinero.',
    q:'O que essa mudança de sentido revela?',
    a:'Que a palavra simplesmente mudou com o tempo, por acaso',
    b:'Que uma língua também pode ser colonizada por dentro',
    ok:'b',
    porque:'O que uma cultura chamava de "encontro", a outra passou a chamar de "mexerico". A palavra sobreviveu, mas foi rebaixada. Apagar não é a única forma de dominar uma língua: ressignificar também é.',
    quase:'Palavras mudam com o tempo, é verdade — mas aqui a direção não é neutra. O sentido coletivo virou pejorativo, e isso tem a ver com quem passou a ter o poder de nomear.' },
  { k:'cul', t:'A chupalla',
    r:'O chapéu do huaso, símbolo da chilenidade, tem nome mapudungun.',
    d:'Procure "Chile" numa imagem e você vai achar um huaso: o homem do campo das festas nacionais, da cueca, do rodeio. O chapéu dele se chama chupalla, do mapudungun achupalla — o nome da planta com que era trançado. E o huaso não surgiu do nada: é o que sobrou da hacienda e do inquilinaje, o trabalhador que morava na terra do patrão e pagava com trabalho.',
    q:'O que a chupalla ensina sobre símbolos nacionais?',
    a:'Que o emblema do país é mestiço até no nome do chapéu',
    b:'Que o huaso é de origem puramente espanhola',
    ok:'a',
    porque:'O símbolo mais "chileno" que existe carrega uma palavra indígena na cabeça — literalmente. Separar o Chile em dois é impossível: ele já nasceu misturado, inclusive no que considera mais seu.',
    quase:'De puramente espanhol não tem nada: o nome do chapéu é mapudungun e a planta é daqui. É justamente a mistura que faz o símbolo funcionar.' },
  { k:'geo', t:'A mesa',
    r:'Batata, milho e feijão daqui. Trigo, uva e porco de lá. A empanada é a soma literal.',
    d:'A batata foi domesticada nos Andes e hoje é um dos alimentos mais cultivados do planeta — saiu daqui para o mundo. Milho, feijão, merkén, curanto e pebre também são daqui. Trigo, uva, vinho e porco vieram com os espanhóis. E o prato mais chileno de todos junta os dois num bocado: massa europeia, recheio americano.',
    q:'Qual é o jeito mais rápido de explicar mestiçagem a alguém?',
    a:'Mostrar uma empanada e dizer de onde vem cada parte',
    b:'Listar as datas da colonização',
    ok:'a',
    porque:'A comida torna visível o que a data esconde: o resultado. Datas contam o processo; o prato mostra que o encontro produziu algo que não existia antes em nenhum dos dois lados.',
    quase:'As datas importam e estão nas outras aulas — mas elas explicam o processo, não o resultado. Para ver o resultado, olhe o prato.' },
  { k:'ori', t:'Os dois 8,8%',
    r:'Mapuche: 1,6 milhão. Imigrantes: 1,6 milhão. Os dois são o Chile.',
    d:'O Censo de 2024 contou 18.480.432 habitantes. Um milhão e seiscentas mil pessoas se declaram mapuche — 8,8%. E há um milhão e seiscentas mil pessoas imigrantes — também 8,8%, número que dobrou em sete anos, com venezuelanos à frente. Antes deles vieram alemães ao sul, croatas a Magallanes e cerca de meio milhão de palestinos: a maior comunidade palestina fora do Oriente Médio.',
    q:'O que a coincidência entre os dois números mostra?',
    a:'Que quem chegou primeiro e quem chegou ontem pesam igual na conta',
    b:'Que os imigrantes estão substituindo a população originária',
    ok:'a',
    porque:'Um país não é feito só de quem estava aqui nem só de quem chegou. É feito dos dois, somados, e a aritmética torna isso difícil de ignorar.',
    quase:'Substituição não há: são grupos distintos, e a população mapuche cresceu nos últimos censos. O que os números mostram é soma, não troca.' }]}
];

var TRILHA = [
{ id:'e1', n:'01', alt:'0 m', altn:'nível do mar', cor:'var(--pacifico)', ico:'onda', x:110, y:548,
  h:'Por que o mar do Chile é frio?', local:'Isla Negra · litoral de Valparaíso',
  res:'A corrente de Humboldt sobe do sul carregando água gelada. É ela que explica a neblina da costa, a fartura de peixe e, mais ao norte, o deserto mais seco do mundo.',
  pontos:[
  { k:'geo', t:'A corrente que vem do sul',
    r:'Uma corrente fria numa latitude que deveria ser quente.',
    d:'A corrente de Humboldt sobe da Antártida pela costa oeste da América do Sul. A água fria esfria o ar que passa sobre ela, e ar frio não sobe nem forma chuva — ele vira neblina. Compare com o litoral brasileiro na mesma altura do mapa: mesma latitude, mares completamente diferentes.',
    q:'O Chile e o Brasil estão em latitudes parecidas. Por que o mar daqui é gelado?',
    a:'Porque o Chile é mais perto da Antártida',
    b:'Porque uma corrente fria sobe pela costa do Pacífico',
    ok:'b',
    porque:'A latitude é parecida — quem muda tudo é a corrente. Ela traz água polar para uma região de clima ameno, e por isso o mar é gelado mesmo no verão.',
    quase:'Distância não explica: Santiago e São Paulo estão quase na mesma latitude. O que separa os dois mares é a corrente que passa em cada um.' },
  { k:'ori', t:'Quem pescava aqui',
    r:'A costa central era território picunche — "gente do norte", ramo setentrional dos mapuche.',
    d:'Pescavam e cultivavam neste litoral muito antes de existir casa de poeta. O nome picunche vem de pikun (norte) e che (gente): é como os mapuche do sul chamavam seus parentes do norte. Mapuche não é uma tribo — é um povo grande, com nomes diferentes conforme onde vive.',
    q:'O que o nome "picunche" ensina?',
    a:'Que era um povo inimigo dos mapuche',
    b:'Que mapuche é um povo grande, com nomes por região',
    ok:'b',
    porque:'Picunche quer dizer "gente do norte". Huilliche, "gente do sul". São todos mapuche — a divisão é geográfica, não de inimizade. A língua organiza o mundo pelo lugar.',
    quase:'Inimigos não eram: picun-che significa literalmente "gente do norte", um nome de posição dentro do mesmo povo.' },
  { k:'cul', t:'A casa de Neruda',
    r:'Pablo Neruda e Matilde Urrutia estão enterrados aqui, de frente para o mar.',
    d:'A casa é um inventário do que o oceano traz: mascarões de proa, conchas, garrafas, mapas. Um poeta que colecionava os objetos que o mar deixava — e que escolheu ser enterrado olhando para ele.',
    q:'Por que a casa de um poeta entra numa aula de geografia?',
    a:'Porque mostra como as pessoas respondem ao lugar onde vivem',
    b:'Por curiosidade turística, sem relação com o tema',
    ok:'a',
    porque:'Cultura é o que um lugar faz com quem mora nele. Um poeta que coleciona o que o mar traz está respondendo à mesma geografia que explica a neblina e o peixe.',
    quase:'A relação existe e é direta: a coleção dele é feita do que aquele oceano específico traz até a praia.' },
  { k:'lin', t:'Uma ilha que não é ilha',
    r:'Isla Negra não é ilha e não é negra.',
    d:'Nomes de lugar fazem três coisas: descrevem, inventam e erram. Alguns contam a paisagem com precisão, outros contam a expectativa de quem chegou, e outros simplesmente pegaram e ficaram. O nome de um lugar é um documento de quem o nomeou.',
    q:'O que nomes como "Isla Negra" revelam?',
    a:'A história de quem chegou e nomeou o lugar',
    b:'Apenas um erro de tradução',
    ok:'a',
    porque:'Topônimos são camadas de história: cada nome registra alguém que passou, viu e decidiu chamar assim. A aula 4 mostra o caso extremo disso — um morro com dois nomes e duas visões de mundo.',
    quase:'Não é erro de tradução — é escolha de nomeação, e escolhas assim guardam a visão de quem as fez.' }]},

{ id:'e2', n:'02', alt:'350 m', altn:'vale central', cor:'var(--valle)', ico:'uva', x:340, y:470,
  h:'Por que Chile, Itália e Califórnia plantam a mesma coisa?', local:'Valle del Maipo · Talagante',
  res:'Só existem cinco regiões de clima mediterrâneo no planeta inteiro. Esta é uma delas — e a água que rega a parreira começou como neve na cordilheira.',
  pontos:[
  { k:'geo', t:'Cinco lugares no mundo',
    r:'Inverno chuvoso, verão seco. Bacia do Mediterrâneo, Califórnia, Cabo, sul da Austrália e Chile central.',
    d:'São os únicos cinco lugares do planeta com esse padrão. Por isso os cinco plantam as mesmas coisas: uva, azeitona, trigo. Não é coincidência cultural nem imitação — é o clima permitindo as mesmas culturas em continentes diferentes.',
    q:'Por que esses cinco lugares plantam as mesmas coisas?',
    a:'Porque trocaram sementes entre si ao longo da história',
    b:'Porque têm o mesmo tipo de clima',
    ok:'b',
    porque:'O clima mediterrâneo ocorre em faixas específicas, sempre no lado oeste dos continentes, em latitudes médias. Onde ele aparece, as mesmas plantas prosperam — mesmo sem ninguém combinar.',
    quase:'Houve troca de sementes, sim — mas elas só vingaram onde o clima deixou. A Califórnia recebeu videira europeia; o deserto ao lado, não.' },
  { k:'ori', t:'A água já era domada',
    r:'Antes das parreiras, o vale já tinha canais de irrigação.',
    d:'Os povos do vale central plantavam milho, feijão e batata usando canais puxados dos rios do degelo. É a mesma engenharia que a vinha usa hoje, com outro dono. A irrigação do Maipo não foi inventada no século XIX — ela foi herdada e ampliada.',
    q:'Quem primeiro irrigou o vale central?',
    a:'Os povos originários, antes da chegada espanhola',
    b:'Os imigrantes franceses, no século XIX',
    ok:'a',
    porque:'A rede de canais já existia. Os europeus encontraram um vale cultivado, não um vazio a ser domado — e aproveitaram a infraestrutura que ali estava.',
    quase:'Os franceses trouxeram cepas e técnicas de vinificação no século XIX, mas chegaram a um vale que já era irrigado havia séculos.' },
  { k:'cul', t:'A vinha e o calendário',
    r:'A videira chega com os espanhóis e se refina com a imigração francesa do século XIX.',
    d:'O ano do campo tem ritmo próprio: poda no inverno, brotação na primavera, vindima no fim do verão, e a festa que a encerra. É um calendário que organiza a vida das famílias do vale há gerações — e que define quem trabalha a terra e quem aparece no rótulo.',
    q:'O que a vinha chilena mostra sobre a colonização?',
    a:'Que ela trouxe plantas novas que se somaram às daqui',
    b:'Que substituiu completamente a agricultura anterior',
    ok:'a',
    porque:'A uva veio de fora e vingou aqui por causa do clima. Mas milho, feijão e batata continuaram. O vale de hoje planta as duas heranças, lado a lado.',
    quase:'Substituição completa não houve: os cultivos originários seguem na mesa chilena. O que houve foi soma, ainda que desigual.' },
  { k:'lin', t:'As palavras do vinho',
    r:'Cepa, vendimia, bodega, viña — um vocabulário inteiro que veio junto com a planta.',
    d:'Quando uma técnica atravessa o oceano, as palavras dela vêm junto. E o espanhol do campo chileno tem som próprio: terminações comidas, o voseo, um ritmo que dá ao chileno a fama de ser o mais difícil de entender entre os hispanofalantes.',
    q:'Por que palavras novas chegam junto com técnicas novas?',
    a:'Porque a língua antiga não tinha nome para o que era novo',
    b:'Porque é proibido traduzir termos técnicos',
    ok:'a',
    porque:'Toda coisa nova precisa de nome. Quando a videira chega, chegam vindima, cepa e bodega — porque não havia palavra local para processos que não existiam.',
    quase:'Proibição não existe — muitos termos foram traduzidos. Os que ficaram no original ficaram por falta de equivalente.' }]},

{ id:'e3', n:'03', alt:'550 m', altn:'Santiago', cor:'var(--sol)', ico:'fala', x:560, y:392,
  h:'De onde vêm as palavras que a gente nem percebe?', local:'Barrio Lastarria · Santiago',
  res:'Guata, pololo, quiltro, choclo. Um chileno pode nunca ter estudado mapudungun e usar dez palavras dele antes do almoço.',
  pontos:[
  { k:'lin', t:'Pololo',
    r:'Namorado, em chileno. Vem do mapudungun, onde era o nome de um inseto que zumbe.',
    d:'A palavra é tão corrente que virou verbo: pololear. Ninguém pensa na origem ao usá-la. E não está sozinha: guata é barriga, quiltro é vira-lata, pichintún é um pouquinho, choclo é milho. Poncho, laucha, pucho, ruca, curanto — todas mapudungun.',
    q:'O que significa o fato de essas palavras serem usadas sem que ninguém saiba de onde vêm?',
    a:'Que a língua indígena vive dentro do espanhol chileno',
    b:'Que são palavras antigas, já sem uso',
    ok:'a',
    porque:'Uma língua ameaçada sobrevive dentro da fala cotidiana de todo mundo — inclusive de quem nunca ouviu falar dela. Isso é presença, não passado.',
    quase:'Sem uso elas não estão: são das palavras mais usadas do dia a dia chileno. O que se perdeu foi a consciência da origem, não a palavra.' },
  { k:'ori', t:'Uma língua em risco',
    r:'Só 14% dos mapuche entrevistados falam mapudungun com fluência. A média de idade de quem fala é 64 anos.',
    d:'Esses dois números juntos descrevem uma língua que pode desaparecer em uma geração. Dizer que "pololo" vem do mapudungun é bonito; dizer que a língua de onde ele veio corre risco é o que torna a informação séria.',
    q:'Por que a média de idade dos falantes importa tanto?',
    a:'Porque mostra que a língua pode se perder em uma geração',
    b:'Porque pessoas mais velhas falam melhor',
    ok:'a',
    porque:'Se quem fala tem 64 anos em média e os jovens não aprendem, a transmissão está interrompida. Uma língua não morre de uma vez — ela deixa de ser passada adiante.',
    quase:'Não se trata de falar melhor ou pior: trata-se de quem ainda aprendeu em casa. A idade dos falantes é um sinal de transmissão interrompida.' },
  { k:'geo', t:'A cidade na bacia',
    r:'Santiago fica numa bacia fechada entre duas cordilheiras.',
    d:'Isso dá à cidade a vista das montanhas de qualquer esquina — e também o problema do ar parado no inverno, quando a poluição não encontra para onde ir. A mesma geografia que emoldura é a que sufoca.',
    q:'Por que Santiago tem problema de poluição no inverno?',
    a:'Porque tem mais indústrias que outras cidades',
    b:'Porque as montanhas prendem o ar dentro da bacia',
    ok:'b',
    porque:'A bacia fechada e o ar frio do inverno formam uma tampa: o ar não circula e o que é emitido fica. A geografia que dá a vista bonita é a que segura a fumaça.',
    quase:'A quantidade de emissão importa, mas a diferença está na dispersão: outras cidades emitem e o vento leva. Aqui as montanhas seguram.' },
  { k:'cul', t:'Um bairro com nome de gente',
    r:'Lastarria leva o nome de José Victorino Lastarria, escritor e político do século XIX.',
    d:'Hoje é o quarteirão dos livros, do cinema e dos cafés — um bairro que mudou completamente de função sem mudar de nome. Boa parte de Santiago é batizada assim: com nomes de homens do século XIX, numa cidade cujo chão tem nomes muito mais antigos.',
    q:'O que os nomes das ruas de uma cidade revelam?',
    a:'Quem teve o poder de nomear, e quando',
    b:'A ordem em que as ruas foram construídas',
    ok:'a',
    porque:'Nomear é um ato de poder. As camadas de nomes de uma cidade mostram quem mandava em cada época — e o que foi substituído no caminho.',
    quase:'A ordem de construção quase nunca aparece nos nomes. O que aparece é quem era importante para quem batizou.' }]},

{ id:'e4', n:'04', alt:'629 m', altn:'cume do cerro', cor:'var(--cobre)', ico:'morro', x:700, y:330,
  h:'Por que este morro tem dois nomes?', local:'Cerro Santa Lucía · Santiago',
  res:'Os mapuche o chamam de Huelén: tristeza. Os espanhóis rebatizaram com o nome de uma santa. Dois nomes, duas visões de mundo, a mesma pedra.',
  pontos:[
  { k:'lin', t:'Huelén',
    r:'Em mapudungun quer dizer melancolia, tristeza, dor.',
    d:'Os espanhóis rebatizaram o morro de Santa Lucía. Os dois nomes continuam existindo: um nos documentos oficiais, outro na memória e no uso. Nenhum episódio da série explica melhor o que é o Mapa Falado — porque o nome de um lugar é a forma mais curta de uma visão de mundo.',
    q:'O que acontece quando um lugar tem dois nomes?',
    a:'Um deles é o verdadeiro e o outro é errado',
    b:'Os dois são verdadeiros, e alguém escolheu qual fica no mapa',
    ok:'b',
    porque:'Todo mapa é uma escolha. O nome que ficou registrado não é mais correto — é o de quem teve o poder de registrar. O outro continua ali, embaixo.',
    quase:'Não há nome errado: há dois nomes de duas culturas. O que existe é uma decisão sobre qual deles aparece nos documentos.' },
  { k:'geo', t:'Um cerro-ilha',
    r:'A rocha dura que sobrou quando a água levou a terra mole do vale.',
    d:'O vale central é sedimentar: terra trazida e depositada pela água ao longo de milhões de anos. Onde havia rocha mais resistente, a erosão não levou — e sobrou um morro isolado no meio da planície. É por existir esta pedra que Santiago existe onde existe.',
    q:'Por que sobra uma pedra no meio de um vale plano?',
    a:'Porque alguém a construiu ali',
    b:'Porque é mais dura que o terreno em volta e resistiu à erosão',
    ok:'b',
    porque:'A água levou o que era mole e deixou o que era duro. Um cerro-ilha é literalmente o que sobrou — e aqui esse resto virou o ponto alto que decidiu onde a cidade nasceria.',
    quase:'Construída não foi: é formação natural. O que a erosão não conseguiu levar ficou de pé.' },
  { k:'ori', t:'Cinco meses depois',
    r:'Michimalonco queimou Santiago inteira em 11 de setembro de 1541.',
    d:'A cidade tinha sido fundada aos pés deste morro em fevereiro. Em setembro, os povos do Aconcágua, do Mapocho e do Cachapoal se uniram e a destruíram. Ela foi reconstruída do zero. A fundação que os livros contam com uma data teve, na verdade, duas.',
    q:'Por que Pedro de Valdivia escolheu este lugar para fundar a cidade?',
    a:'Porque era ponto alto, defensável e ficava junto a um rio',
    b:'Porque era um lugar vazio, sem ninguém por perto',
    ok:'a',
    porque:'Altura, defesa e água: os três critérios de quem funda uma cidade para ser atacada. O próprio local escolhido admite que havia com quem lutar.',
    quase:'Vazio não era. O vale era habitado e cultivado — tanto que cinco meses depois a cidade foi destruída por quem já morava ali.' },
  { k:'cul', t:'De lixão a jardim',
    r:'Pedreira, lixão, cemitério — e, em 1872, jardim público.',
    d:'A cidade deu as costas ao morro por séculos: dele se tirou pedra, nele se jogou lixo, nele se enterrou quem não era católico. Em 1872 o intendente Benjamín Vicuña Mackenna transformou tudo em passeio público, com escadarias, terraços, a Fonte de Netuno e uma ermida de pedra que virou o jazigo da própria família.',
    q:'O que a sequência de usos do morro mostra?',
    a:'Que a cidade mudou de ideia sobre o que fazer com seu passado',
    b:'Que o morro sempre foi um lugar valorizado',
    ok:'a',
    porque:'O mesmo lugar foi sagrado, fortaleza, pedreira, lixão, cemitério e jardim. Cada uso é uma decisão de uma época sobre o que merece cuidado — e todas estão empilhadas ali.',
    quase:'Valorizado nem sempre foi: por muito tempo o morro foi exatamente onde a cidade punha o que não queria ver.' }]},

{ id:'e42', n:'4.2', alt:'629 m', altn:'mesma pedra', cor:'var(--andino)', ico:'camada', x:800, y:276,
  h:'Quem estava aqui antes de Santiago?', local:'Cerro Santa Lucía · a história longa',
  res:'Mesmo lugar, outra escala de tempo: os 342 anos entre a fundação da cidade e o fim da autonomia mapuche.',
  pontos:[
  { k:'ori', t:'O vale já era mundo',
    r:'Terra cultivada, com irrigação, e um império que chegou e parou.',
    d:'Não era paisagem esperando gente: havia milho, feijão, batata e canais puxados dos rios do degelo. E o Tawantinsuyu inca, o maior império da América, alcançou o Chile central e não passou daqui. A resistência que travaria os espanhóis já havia travado alguém antes.',
    q:'O que significa dizer que o vale era "paisagem trabalhada"?',
    a:'Que era natureza intocada, sem presença humana',
    b:'Que já havia agricultura, irrigação e organização do território',
    ok:'b',
    porque:'Paisagem trabalhada é terra modificada por quem vive nela. Chamar de "vazio" o que era cultivado foi a forma mais eficiente de justificar a tomada.',
    quase:'Intocada não era: havia canais, plantações e povoados. A ideia de vazio é uma construção posterior, não uma descrição.' },
  { k:'cul', t:'A virada de 1641',
    r:'Quilín: o Biobío vira fronteira reconhecida e dura até depois da independência.',
    d:'Em 6 de janeiro de 1641, depois de quase um século de guerra, espanhóis e mapuche assinam o primeiro tratado de paz. A Coroa reconhece a liberdade mapuche em seu território. Um império europeu, no auge, assinando acordo de fronteira com um povo indígena na América.',
    q:'Por que esse tratado é tão incomum?',
    a:'Porque um império europeu reconheceu a soberania de um povo indígena',
    b:'Porque foi o primeiro tratado da história da América',
    ok:'a',
    porque:'O padrão colonial era a submissão, não o acordo entre iguais. Quilín é exceção — e por isso quase não é ensinado: ele contraria a história de conquista inevitável.',
    quase:'Primeiro da história não foi — houve outros acordos antes. O que torna Quilín notável é o que ele reconhece: uma fronteira que a Coroa não podia cruzar.' },
  { k:'lin', t:'A frase que não se sustenta',
    r:'"Os europeus chegaram e conquistaram tudo" — aqui, não conquistaram.',
    d:'Por quase três séculos o território ao sul do Biobío permaneceu fora do domínio espanhol. Quem o tomou foi o Estado chileno já independente, entre 1861 e 1883. Isso muda a natureza do que se aprende: colonização não é um evento distante, é um processo com datas recentes e consequências vivas.',
    q:'Quem concluiu a tomada do território mapuche?',
    a:'A Coroa espanhola, durante o período colonial',
    b:'O Estado chileno, décadas depois da independência',
    ok:'b',
    porque:'Entre 1861 e 1883, a república já independente ocupou militarmente o território e transferiu as comunidades para reduções. A conta foi fechada por um país que já se dizia livre.',
    quase:'A Espanha nunca conquistou aquele território — ela assinou um tratado reconhecendo que não mandava ali.' },
  { k:'geo', t:'Um mapa que muda quatro vezes',
    r:'A linha do Biobío acende em 1641, fica, e some em 1883.',
    d:'É a forma mais econômica de contar a história inteira: um mapa só, com uma linha. Ela aparece com o tratado, atravessa dois séculos imóvel, sobrevive à independência de 1818 e desaparece entre 1861 e 1883. No fim, acendem os pontos das comunidades de hoje.',
    q:'Por que mostrar isso num mapa em vez de contar com datas?',
    a:'Porque a geografia torna visível o que a lista de datas esconde',
    b:'Porque mapas são mais bonitos que textos',
    ok:'a',
    porque:'Uma linha que permanece dois séculos e some em vinte anos conta a desproporção de um jeito que nenhuma lista consegue. A forma do território é argumento.',
    quase:'Beleza não é o critério: o mapa é escolhido porque mostra duração e ruptura ao mesmo tempo, coisa que uma lista de datas não faz.' }]},

{ id:'e5', n:'05', alt:'2.500 m', altn:'cânion andino', cor:'var(--pacifico-2)', ico:'agua', x:900, y:190,
  h:'De onde vem a água de Santiago?', local:'Cajón del Maipo · alta cordilheira',
  res:'Um vale em V escavado pelo rio Maipo. A neve que cai aqui no inverno é a água que sai da torneira da cidade na primavera.',
  pontos:[
  { k:'geo', t:'Uma bacia inteira',
    r:'Neve, degelo, rio, represa, cidade, parreira — o circuito completo.',
    d:'O rio Maipo nasce do degelo da alta cordilheira e abastece a área metropolitana de Santiago. É a mesma água que, mais abaixo, rega as parreiras do vale. Este episódio e o da vinha contam o mesmo ciclo, de pontas opostas.',
    q:'De onde vem a água que abastece uma cidade de sete milhões de pessoas?',
    a:'Da neve que derrete na cordilheira',
    b:'De poços profundos sob a cidade',
    ok:'a',
    porque:'A cordilheira funciona como reservatório: acumula neve no inverno e libera água no degelo. Um inverno sem neve é um ano sem água — e é isso que torna a aula 6 urgente.',
    quase:'Há água subterrânea, mas o volume vem do degelo andino. Por isso a quantidade de neve no inverno é notícia de primeira página no Chile.' },
  { k:'lin', t:'Cajón',
    r:'Quer dizer caixa, gaveta. No Chile virou termo geográfico.',
    d:'Um vale estreito de paredes altas é, literalmente, uma caixa. A palavra doméstica subiu a montanha e virou acidente de relevo. É o movimento inverso do pololo, na aula 3: lá uma palavra indígena virou cotidiano; aqui uma palavra cotidiana virou geografia.',
    q:'O que acontece com a palavra "cajón" no Chile?',
    a:'Uma palavra de casa passa a nomear uma forma do relevo',
    b:'Perde o sentido original e passa a significar só vale',
    ok:'a',
    porque:'Ela mantém o sentido de caixa e ganha outro, geográfico. As línguas aproveitam o que já têm para nomear o que encontram — e a forma do vale realmente lembra uma gaveta aberta.',
    quase:'O sentido original continua vivo: cajón ainda é gaveta em espanhol. O que houve foi acréscimo, não troca.' },
  { k:'ori', t:'A montanha ligava',
    r:'Maipo e Mapocho são nomes mapudungun. As passagens eram caminho, não barreira.',
    d:'Muito antes de existir estrada, as passagens da cordilheira eram rotas de troca. Povos dos dois lados dos Andes cruzavam para negociar, trocar e casar — e seguem se reconhecendo como parentes hoje, apesar da fronteira entre Chile e Argentina.',
    q:'O que a cordilheira representava para os povos originários?',
    a:'Uma barreira intransponível que separava os povos',
    b:'Um caminho com passagens conhecidas, usado para troca',
    ok:'b',
    porque:'Fronteiras nacionais são recentes. Para quem vivia ali, a montanha era território conhecido e atravessável — e os laços de parentesco entre os dois lados continuam existindo.',
    quase:'Intransponível não era: havia passos conhecidos e rotas de troca estabelecidas há séculos. A ideia de barreira é dos mapas nacionais, não de quem morava lá.' },
  { k:'cul', t:'A disputa pela água',
    r:'Quem usa, quem represa, quem fica sem.',
    d:'Povoados de montanha a duas horas da capital e a séculos de distância dela. Represas, mineração e agricultura disputam o mesmo rio que abastece a cidade. A pergunta do episódio não tem resposta pronta — e é melhor que não tenha.',
    q:'Por que a água do Maipo é objeto de disputa?',
    a:'Porque o mesmo rio serve cidade, agricultura e mineração',
    b:'Porque há água demais e ninguém sabe o que fazer com ela',
    ok:'a',
    porque:'Um recurso finito com vários usuários é a definição de conflito. E o volume depende da neve do inverno — que, como mostra a aula 6, nem sempre vem.',
    quase:'Demais não há: o Chile central enfrenta seca há anos. É a escassez que acirra a disputa.' }]},

{ id:'e6', n:'06', alt:'3.330 m', altn:'alta montanha', cor:'var(--andino-2)', ico:'neve', x:1040, y:128,
  h:'O que muda a cada mil metros de subida?', local:'El Colorado · Farellones',
  res:'Em 9 de julho de 2026, 90% das pistas estavam fechadas por falta de neve. Em 20 de julho chegaram dois sistemas frontais. A Ana subiu no dia 22.',
  pontos:[
  { k:'geo', t:'A seca que quebrou numa semana',
    r:'De 90% das pistas fechadas a dois sistemas frontais em onze dias.',
    d:'A associação dos centros de esqui reportava, no início de julho de 2026, que quase tudo estava inabilitado por falta de precipitação — o pouco que havia era neve artificial, dentro de uma seca de anos. Em 20 de julho chegaram dois sistemas frontais previstos como os mais intensos do ano, com a isoterma zero descendo a 1.600 metros.',
    q:'Por que a quantidade de neve de um inverno importa para quem mora na cidade?',
    a:'Porque a neve é o reservatório de água do ano seguinte',
    b:'Porque afeta apenas o turismo de esqui',
    ok:'a',
    porque:'A neve que cai na cordilheira derrete na primavera e vira a água de Santiago e das plantações do vale. Um inverno seco é um ano de escassez — a montanha é a caixa d’água do país.',
    quase:'O esqui sente primeiro, mas o efeito é muito maior: a mesma neve abastece sete milhões de pessoas e a agricultura do vale central.' },
  { k:'ori', t:'Mañke',
    r:'Condor, em mapudungun. O Andino carrega um nome que a língua tem.',
    d:'Na cordilheira ele nunca foi só um bicho: aparece na cosmologia mapuche como aquele que vê de cima e atravessa. O condor também é símbolo pátrio do Chile desde 1834 — mas não é só chileno: está nos escudos da Colômbia e do Equador, e é símbolo na Bolívia, no Peru e na Argentina. Ele é da cordilheira, não de um país.',
    q:'Por que o condor serve de personagem para uma série sobre a América do Sul?',
    a:'Porque é exclusivo do Chile',
    b:'Porque pertence à cordilheira inteira, que atravessa vários países',
    ok:'b',
    porque:'Um personagem exclusivo de um país teria que ser aposentado no fim da temporada. O condor acompanha a série até a Argentina — e no Uruguai, onde não há Andes, a ausência dele vira conteúdo.',
    quase:'Exclusivo não é: aparece nos escudos de três países e é símbolo em vários outros. É um animal andino, não nacional.' },
  { k:'lin', t:'Palavras de altitude',
    r:'A montanha tem vocabulário que o vale não precisa ter.',
    d:'Quem vive em altitude nomeia o que encontra: tipos de neve, de vento, de frio, de perigo. São distinções que não existem no vocabulário de quem mora a 500 metros, porque lá elas não fazem diferença. A língua detalha o que importa para a sobrevivência.',
    q:'Por que a montanha tem palavras que o vale não tem?',
    a:'Porque quem vive lá precisa distinguir coisas que no vale não importam',
    b:'Porque é uma língua diferente',
    ok:'a',
    porque:'Toda comunidade cria vocabulário fino para o que precisa decidir todo dia. Tipos de neve importam para quem anda nela — e não para quem nunca a viu.',
    quase:'É a mesma língua: o que muda é o vocabulário específico que cada ambiente exige de quem vive nele.' },
  { k:'cul', t:'Quem vive em 3.330 m',
    r:'Quem trabalha na montanha fora da temporada, e como se chegava antes da estrada.',
    d:'A estrada para Farellones sobe em dezenas de curvas numeradas. Antes dela, chegar ali era expedição. Hoje há quem more na montanha o ano inteiro, com um calendário de trabalho que depende inteiramente de quanto nevou no inverno.',
    q:'O que a subida a El Colorado mostra sobre altitude?',
    a:'Que vegetação, temperatura e modo de vida mudam a cada mil metros',
    b:'Que a paisagem é igual até o topo',
    ok:'a',
    porque:'Subir mil metros equivale, em termos de clima, a avançar centenas de quilômetros em direção aos polos. A vegetação some, a temperatura cai, o ar rarefaz — e o modo de vida acompanha.',
    quase:'Igual não fica: entre Santiago e El Colorado a vegetação desaparece e a temperatura cai vários graus, em menos de 40 km de estrada.' }]}
];
