var UY_CONTEXTO = [
{ id:'u-c1', tag:'Antes da chegada dos europeus', cor:'var(--andino)', ico:'bussola',
  h:'O que era a Banda Oriental antes de ter nome?',
  sub:'A margem leste, antes de ser país',
  res:'Nem país, nem colônia, nem fronteira: uma faixa de campo entre o rio e o oceano, percorrida por povos que não a dividiam em margens.',
  pontos:[
  { k:'ori', t:'Os charrua e os guarani',
    r:'Caçadores da planície e navegadores dos rios, antes de qualquer bandeira.',
    d:'Os charrua percorriam o campo e a costa; os guarani ocupavam as margens dos rios, com agricultura e canoa. Para eles a água era caminho, não limite — e as duas margens do estuário faziam parte do mesmo território percorrido.',
    q:'O que o rio representava para os povos que viviam aqui?',
    a:'Um caminho que ligava as duas margens',
    b:'Uma fronteira natural que as separava',
    ok:'a',
    porque:'A ideia de margem como limite é europeia e posterior. Quem navegava via o estuário como via a cordilheira no Chile: passagem, não barreira.',
    quase:'Separar foi o que os impérios fizeram depois. Antes disso, atravessar era rotina.' },
  { k:'geo', t:'Um país sem montanha',
    r:'O ponto mais alto tem pouco mais de 500 metros.',
    d:'Depois de duas temporadas de cordilheira, o contraste é didático: aqui não há degelo, não há isoterma, não há passo fechado por neve. A água vem da chuva. O relevo é de coxilhas — ondulações suaves que não barram nada: nem o vento, nem o gado, nem os exércitos.',
    q:'O que a ausência de relevo significou para a história uruguaia?',
    a:'Território sem barreira natural: fácil de atravessar, difícil de defender',
    b:'Nada: relevo não influi em história',
    ok:'a',
    porque:'Sem obstáculo, a Banda Oriental foi atravessada por portugueses, espanhóis, brasileiros e argentinos. Compare com o Biobío chileno, onde um rio segurou um império por dois séculos — ali a geografia protegeu; aqui, expôs.',
    quase:'É justamente a tese da série: o relevo condiciona a história, para proteger ou para expor.' },
  { k:'lin', t:'Banda Oriental',
    r:'O nome antigo descreve uma posição, não uma identidade.',
    d:'Significa apenas "a margem leste" — do rio Uruguai. Era assim que a região era chamada quando ainda não era país: pelo lado em que ficava. Um lugar nomeado pela relação com outro lugar, que precisaria inventar depois um nome próprio.',
    q:'O que o nome "Banda Oriental" revela?',
    a:'Que a região era definida pela posição em relação a outra coisa',
    b:'Que havia uma banda musical conhecida na região',
    ok:'a',
    porque:'Ser "o outro lado" de alguém é o ponto de partida mais difícil para construir identidade — e é exatamente o problema que o país vai enfrentar no século XIX.',
    quase:'"Banda" aqui significa lado, margem: uso antigo do espanhol, sem relação com música.' },
  { k:'cul', t:'Uruguai',
    r:'O nome do país é guarani e descreve um rio.',
    d:'Vem de <em>urugua-í</em>, com traduções que apontam para "rio dos caracóis" ou "rio dos pássaros". Como Paraná e Huelén, é um nome que descreve o lugar — e que sobreviveu à troca de donos, porque nome de rio é palavra usada todo dia.',
    q:'Por que nomes de rio costumam sobreviver às trocas de domínio?',
    a:'Porque são usados diariamente por todos, inclusive por quem chega',
    b:'Porque há leis que proíbem mudá-los',
    ok:'a',
    porque:'Rebatizar um rio exige que todo mundo pare de usar o nome antigo — o que quase nunca acontece. Por isso a hidrografia da América guarda tanta toponímia indígena.',
    quase:'Proteção legal é recente e pontual. A sobrevivência vem do uso cotidiano.' }]},

{ id:'u-c2', tag:'A colonização', cor:'var(--cobre)', ico:'espada',
  h:'Por que dois impérios brigaram por uma cidade pequena?',
  sub:'Colonia del Sacramento · 1680 a 1777',
  res:'Portugal fundou uma cidade bem em frente a Buenos Aires. Não era um erro de cálculo: era o cálculo. Quem controla as duas margens controla a entrada do continente.',
  pontos:[
  { k:'cul', t:'Uma cidade plantada de propósito',
    r:'Portugal funda Colonia em 1680, à vista do porto espanhol.',
    d:'A Espanha controlava Buenos Aires e o comércio legal do estuário. Portugal instalou, a poucas horas de barco, um entreposto por onde mercadoria entrava e saía sem passar pela alfândega espanhola. Colonia não foi fundada apesar da proximidade — foi fundada <strong>por causa</strong> dela.',
    q:'Qual era a função principal de Colonia para Portugal?',
    a:'Ser porta de contrabando na entrada do estuário',
    b:'Abrigar colonos agricultores portugueses',
    ok:'a',
    porque:'Era uma peça comercial e militar, não um projeto de povoamento. A cidade pequena valia pelo que permitia atravessar por ela.',
    quase:'Houve povoamento, mas secundário: a razão de ser era o controle da entrada do estuário.' },
  { k:'geo', t:'Oito vezes de dono',
    r:'A cidade trocou de mãos repetidamente entre as duas coroas.',
    d:'Guerras e tratados a devolveram de um lado para o outro ao longo de quase um século, até o Tratado de Santo Ildefonso, em 1777. Cada troca deixou marca: o centro histórico, hoje Patrimônio Mundial, mistura as duas arquiteturas rua a rua — e o próprio calçamento revela qual império pavimentou cada trecho.',
    q:'Por que a cidade mudou de dono tantas vezes?',
    a:'Porque sua posição valia mais do que ela própria',
    b:'Porque era rica em recursos naturais',
    ok:'a',
    porque:'Não era a cidade que importava: era o que ela controlava. Posições estratégicas trocam de mão sempre que o equilíbrio de forças muda — e aqui ele mudou oito vezes.',
    quase:'Recursos não havia: é uma faixa de costa como tantas. O valor era inteiramente posicional.' },
  { k:'ori', t:'Quem não foi consultado',
    r:'Os tratados dividiram terra habitada sem ouvir quem a habitava.',
    d:'Portugal e Espanha negociaram limites em mesas europeias. O Tratado de Madri, de 1750, trocou Colonia pela região das missões jesuíticas guarani — e a tentativa de transferir aquelas comunidades levou à guerra. As missões foram desmanteladas e seus moradores, dispersados.',
    q:'Quem perdeu quando as duas coroas acertaram suas fronteiras?',
    a:'Os povos que viviam nos territórios negociados',
    b:'Nenhum dos dois impérios',
    ok:'a',
    porque:'Os impérios trocaram terras entre si, cada um com ganhos e perdas. Quem perdeu o território foram as comunidades guarani, que não participaram de nenhuma negociação sobre o lugar onde viviam.',
    quase:'Houve ganhos e perdas para os dois lados europeus — mas nenhum deles perdeu a própria terra.' },
  { k:'lin', t:'Duas línguas na mesma rua',
    r:'O português e o espanhol se alternaram aqui por um século.',
    d:'Cada mudança de domínio trocava a língua oficial, as leis e o modo de construir. Essa alternância deixou herança: ainda hoje o norte do Uruguai, na fronteira com o Brasil, fala variedades de contato entre português e espanhol, com estrutura própria — não improviso, mas fala estabelecida de comunidades inteiras.',
    q:'O portunhol da fronteira uruguaia é:',
    a:'Uma variedade de contato, com padrões próprios',
    b:'Espanhol mal falado',
    ok:'a',
    porque:'Línguas de contato surgem onde duas comunidades convivem por gerações. Julgar como erro é aplicar a régua de um idioma a um fenômeno que é outro.',
    quase:'Avaliar como "mal falado" é julgar de fora. Linguisticamente, é uma variedade com regras consistentes e falantes nativos.' }]},

{ id:'u-c3', tag:'O resultado', cor:'var(--valle)', ico:'mesa',
  h:'Como um país-tampão vira nação?',
  sub:'De 1828 até hoje',
  res:'O Uruguai nasceu porque convinha a Brasil e Argentina que aquela margem não fosse de nenhum dos dois. Teve que inventar, depois, uma razão própria para existir.',
  pontos:[
  { k:'cul', t:'Independência por conveniência alheia',
    r:'Em 1828, com mediação britânica, os dois vizinhos aceitaram criar um Estado entre eles.',
    d:'Nenhum queria o outro controlando a entrada do estuário, e o Reino Unido queria a navegação livre. Um país neutro resolvia o impasse. A independência veio menos de uma vitória própria e mais de um acordo entre terceiros.',
    q:'Por que Brasil e Argentina aceitaram a independência uruguaia?',
    a:'Porque um Estado neutro convinha mais que a vitória do rival',
    b:'Porque reconheceram o direito à autodeterminação',
    ok:'a',
    porque:'Foi geopolítica, não princípio. O interessante é o que vem depois: um país que nasce como solução de equilíbrio precisa construir sozinho uma identidade — e constrói.',
    quase:'Autodeterminação virou argumento, mas o que destravou o acordo foi o interesse dos vizinhos e do Reino Unido.' },
  { k:'geo', t:'Diferença como projeto',
    r:'Laicidade em 1917, educação pública forte, políticas sociais pioneiras.',
    d:'Um país de 3,4 milhões entre dois de dezenas de milhões não compete em escala. O Uruguai competiu em instituição: separou Igreja e Estado cedo, construiu uma rede escolar pública de referência e foi pioneiro em direitos sociais na região.',
    q:'Como um país pequeno se afirma entre vizinhos grandes?',
    a:'Construindo instituições próprias e distintas',
    b:'Isolando-se economicamente',
    ok:'a',
    porque:'Identidade, aqui, foi escolha deliberada de organização — não folclore. É uma resposta diferente da chilena e da argentina ao mesmo problema de ser quem se é.',
    quase:'Isolamento não houve: o país sempre foi profundamente integrado aos vizinhos, na economia e na cultura.' },
  { k:'ori', t:'O que foi apagado e o que resistiu',
    r:'Os charrua foram dizimados em 1831, já sob o Estado independente.',
    d:'É a terceira vez que a série encontra esse padrão: Araucanía no Chile em 1883, Campanha do Deserto na Argentina na mesma década, massacre charrua no Uruguai em 1831. Repúblicas jovens concluindo o que a colônia não concluiu. E resistiu outra presença: o candombe, trazido por africanos escravizados, sobreviveu nos bairros negros de Montevidéu e é hoje patrimônio da humanidade.',
    q:'O que esse padrão repetido nos três países mostra?',
    a:'Que a eliminação dos povos originários foi obra dos Estados independentes',
    b:'Que tudo aconteceu durante a colonização europeia',
    ok:'a',
    porque:'Chile em 1883, Argentina em 1885, Uruguai em 1831. Três países já livres da Espanha. Repetido três vezes, deixa de ser episódio e vira estrutura — e é isso que a série quer que o estudante enxergue.',
    quase:'A colonização reduziu drasticamente as populações, mas os episódios que os três países hoje reconhecem como massacre são posteriores às independências.' },
  { k:'lin', t:'A língua das duas margens',
    r:'Montevidéu e Buenos Aires falam quase igual — e isso não é coincidência.',
    d:'O espanhol rio-platense se formou nas duas margens ao mesmo tempo, com a mesma imigração e o mesmo porto. Voseo, entonação, vocabulário: separaram-se os Estados, não os falares. É o melhor exemplo da série de que fronteira política e fronteira cultural raramente coincidem.',
    q:'Por que as duas margens falam tão parecido?',
    a:'Porque formavam uma mesma região antes de serem dois países',
    b:'Porque a televisão uniformizou a fala no século XX',
    ok:'a',
    porque:'A divisão política veio depois da língua. O rio nunca separou quem falava — e é por isso que a última parada desta temporada pergunta onde, afinal, uma coisa termina e outra começa.',
    quase:'A mídia reforça, mas não cria: a semelhança é mais de um século anterior ao rádio.' }]}
];

var UY_TRILHA = [
{ id:'u1', n:'01', alt:'rio', altn:'água de barro', cor:'var(--cobre)', ico:'camada', x:140, y:430, filma:true,
  h:'Por que Portugal construiu uma cidade de frente para a Espanha?', local:'Colonia del Sacramento',
  res:'Fundada em 1680 bem diante de Buenos Aires: contrabando à vista do rival. Trocou de mãos oito vezes, e o calçamento ainda mostra de quem era cada rua.',
  pontos:[
  { k:'cul', t:'Oito trocas de dono',
    r:'Um entreposto português plantado em frente ao porto espanhol.',
    d:'Quem controla as duas margens controla a entrada do continente. Colonia nasceu para disputar isso, e passou de mão em mão até os tratados do fim do século XVIII. O centro histórico é Patrimônio Mundial e guarda as duas arquiteturas rua a rua.',
    q:'Por que Portugal escolheu exatamente este ponto?',
    a:'Para controlar o comércio e o contrabando na entrada do estuário',
    b:'Por ser o único trecho habitável da margem',
    ok:'a',
    porque:'A proximidade com Buenos Aires não era descuido: era a razão de ser da cidade. Um porto português a poucas horas de barco do porto espanhol significava mercadoria entrando sem passar pela alfândega da Coroa rival.',
    quase:'Toda a margem oriental é habitável. A escolha do ponto exato foi estratégica.' },
  { k:'geo', t:'Ler a rua',
    r:'O calçamento português e o espanhol se distinguem a olho nu.',
    d:'As ruas portuguesas escoam a água pelo centro; as espanholas, pelas laterais. Caminhar por Colonia é ler qual império pavimentou cada trecho. É história registrada no chão, sem placa nenhuma — e um ótimo exercício de observação para um estudante.',
    q:'Como se reconhece uma rua portuguesa em Colonia?',
    a:'A água escoa por uma canaleta no meio da rua',
    b:'As pedras são de outra cor',
    ok:'a',
    porque:'São soluções de drenagem diferentes para o mesmo problema. A cidade guarda a disputa no próprio calçamento — um documento que se pisa.',
    quase:'A pedra é local nos dois casos. O que muda é o desenho do escoamento.' },
  { k:'ori', t:'Antes dos dois impérios',
    r:'A margem era território charrua e guarani muito antes de 1680.',
    d:'A disputa entre Portugal e Espanha se deu sobre terra ocupada. Mais ao norte, as missões jesuíticas guarani também entraram na negociação entre as coroas — e foram desfeitas quando os dois impérios acertaram suas fronteiras no Tratado de Madri.',
    q:'Quem perdeu quando os dois impérios acertaram as fronteiras?',
    a:'Os povos que viviam no território negociado',
    b:'Nenhum dos dois impérios',
    ok:'a',
    porque:'Tratados dividiram terras habitadas sem consultar quem as habitava. As missões guarani foram desmanteladas exatamente por esse acerto, e seus moradores, dispersados.',
    quase:'Os impérios trocaram territórios e saíram com ganhos e perdas — mas quem perdeu a terra foram os povos que viviam nela.' },
  { k:'lin', t:'A água ainda é barro',
    r:'Aqui o Río de la Plata ainda é cor de terra.',
    d:'O sedimento que o Paraná carrega de milhares de quilômetros acima chega até esta margem. A água é marrom, doce e calma. Guarde a cor: ela vai mudar ao longo desta temporada, e a última parada é exatamente onde a mudança termina.',
    q:'Por que a água em Colonia é marrom?',
    a:'Por sedimento trazido pelo rio de milhares de quilômetros acima',
    b:'Por poluição da cidade',
    ok:'a',
    porque:'É terra em suspensão, não sujeira. O mesmo material que forma as ilhas do delta de Tigre, na temporada da Argentina, chega dissolvido até aqui.',
    quase:'Há poluição, como em qualquer estuário urbano, mas a cor vem do sedimento natural do Paraná.' }]},

{ id:'u2', n:'02', alt:'rio', altn:'a capital', cor:'var(--pacifico-2)', ico:'fala', x:480, y:452, planejada:true,
  h:'Como um país pequeno constrói identidade própria?', local:'Montevidéu',
  res:'Entre dois gigantes, o Uruguai se afirmou pela diferença: Estado laico desde 1917, educação pública forte, políticas sociais pioneiras. Quando não dá para competir em tamanho, compete-se em instituição.',
  pontos:[
  { k:'cul', t:'Diferença como projeto',
    r:'Laicidade, educação pública e políticas sociais antes de quase todo mundo.',
    d:'O Uruguai separou Igreja e Estado em 1917, construiu uma rede escolar pública de referência e foi pioneiro em direitos sociais na região. Identidade, aqui, não foi folclore: foi instituição — uma escolha deliberada de um país de 3,4 milhões cercado por dois de dezenas de milhões.',
    q:'Como o Uruguai se diferenciou dos vizinhos?',
    a:'Construindo instituições próprias e distintas',
    b:'Isolando-se economicamente dos dois',
    ok:'a',
    porque:'Laicidade precoce e educação pública marcaram a diferença. Um país pequeno que não pode competir em escala escolheu competir em organização.',
    quase:'Isolamento não houve: o Uruguai sempre foi profundamente integrado aos vizinhos, na economia e na cultura.' },
  { k:'ori', t:'Candombe',
    r:'O tambor africano que virou patrimônio da humanidade.',
    d:'Trazido por africanos escravizados, o candombe sobreviveu nos bairros negros de Montevidéu e hoje é reconhecido pela Unesco. A presença africana no Uruguai foi por muito tempo minimizada no relato nacional — e o tambor é parte de como ela se manteve audível apesar disso.',
    q:'O que o candombe representa na história uruguaia?',
    a:'A permanência da cultura africana apesar da invisibilização',
    b:'Uma tradição trazida da Europa no século XX',
    ok:'a',
    porque:'É herança direta das comunidades negras de Montevidéu, mantida por gerações. Reconhecer o candombe é reconhecer uma presença que o país demorou a assumir.',
    quase:'A origem é africana e local, preservada por comunidades do próprio país ao longo de séculos.' },
  { k:'lin', t:'A mesma língua das duas margens',
    r:'Espanhol rio-platense, com voseo — igual ao de Buenos Aires.',
    d:'Montevidéu e Buenos Aires compartilham o mesmo caldo linguístico, com diferenças finas de entonação. É o melhor exemplo da série sobre como a língua ignora fronteiras: separam-se os Estados, não os falares. E no norte, junto ao Brasil, o contato secular com o português produziu variedades próprias de fronteira.',
    q:'O que o voseo mostra sobre fronteiras linguísticas?',
    a:'Que elas não coincidem com as fronteiras dos países',
    b:'Que cada país criou o seu próprio modo de falar',
    ok:'a',
    porque:'O vos atravessa o rio e também aparece em partes da Bolívia, do Paraguai e da América Central. Mapas de língua e mapas políticos são desenhos diferentes do mesmo continente.',
    quase:'Criar do zero nenhum país criou: o voseo é forma antiga do espanhol que se manteve em algumas regiões e se perdeu em outras.' },
  { k:'geo', t:'Onde o estuário se abre',
    r:'Aqui o rio já é tão largo que a outra margem sumiu.',
    d:'Em Colonia ainda se percebe Buenos Aires do outro lado. Em Montevidéu, não: o estuário alargou e o horizonte é só água. A cidade cresceu de frente para essa imensidão, com uma rambla de mais de vinte quilômetros acompanhando a curva da costa.',
    q:'O que muda entre Colonia e Montevidéu?',
    a:'O estuário se alarga e a margem oposta deixa de ser visível',
    b:'A água já se torna salgada',
    ok:'a',
    porque:'A largura aumenta rumo ao leste. A transição para água salgada ainda não aconteceu — ela se completa na última parada desta temporada.',
    quase:'A salinidade aumenta aos poucos, mas o limite oficial entre rio e oceano está mais a leste, em Punta del Este.' }]},

{ id:'u3', n:'03', alt:'costa', altn:'a cidade inventada', cor:'var(--sol)', ico:'camada', x:790, y:470, planejada:true,
  h:'Como se constrói uma cidade do zero para veranear?', local:'Piriápolis',
  res:'No fim do século XIX, um empresário comprou a terra, plantou um bosque inteiro, construiu um hotel e inventou a primeira cidade balneária do país — antes de existir estrada para chegar até ela.',
  pontos:[
  { k:'cul', t:'Uma cidade de autor',
    r:'Francisco Piria comprou o terreno e desenhou tudo.',
    d:'Piria era empresário, rematador e ocultista. Comprou as terras em 1890, plantou milhões de árvores num solo que era pedra e pasto, construiu o castelo onde morou e depois um grande hotel. A cidade leva o nome dele e seguiu o traçado que ele imaginou.',
    q:'O que torna Piriápolis incomum entre as cidades da região?',
    a:'Foi projetada inteira por uma pessoa, antes de haver moradores',
    b:'Nasceu de um povoado indígena ampliado',
    ok:'a',
    porque:'A maioria das cidades cresce por acúmulo, em torno de um porto, uma igreja ou uma estrada. Esta foi desenhada como projeto privado, com a paisagem construída antes da população.',
    quase:'Não há povoado anterior na origem: a cidade começa como empreendimento, com a terra comprada e arborizada de propósito.' },
  { k:'geo', t:'Paisagem plantada',
    r:'O bosque que cerca a cidade foi plantado, não encontrado.',
    d:'A região era de coxilhas e rocha, com pouca árvore. Piria plantou espécies trazidas de fora para criar sombra e fixar o solo. A paisagem que hoje parece natural é obra humana — um bom exercício para a pergunta: o que, numa paisagem, é mesmo natural?',
    q:'A mata de Piriápolis é nativa?',
    a:'Não: foi plantada de propósito, com espécies trazidas de fora',
    b:'Sim: é vegetação original preservada',
    ok:'a',
    porque:'É um caso claro de paisagem construída. Ensina a desconfiar da aparência de natural — como os canais huarpe em Mendoza, que parecem rio e são engenharia.',
    quase:'A vegetação original da região é de campo e coxilha, com poucas árvores. O bosque é introduzido.' },
  { k:'lin', t:'Nome de dono',
    r:'Piriápolis = Piria + pólis, a cidade de Piria.',
    d:'O grego <em>pólis</em> colado a um sobrenome. É o oposto de Huelén ou Paraná, que descrevem o lugar: aqui o nome registra quem comprou a terra. Topônimos contam quem teve o poder de nomear, e neste caso foi um só homem.',
    q:'O que o nome Piriápolis registra?',
    a:'O proprietário que fundou a cidade',
    b:'Uma característica da paisagem',
    ok:'a',
    porque:'Compare com os nomes indígenas da série: Huelén descreve um sentimento, Paraná descreve a largura do rio. Piriápolis descreve um dono — e essa diferença diz muito sobre cada época.',
    quase:'Nada na paisagem está no nome: ele é formado pelo sobrenome do fundador mais o sufixo grego para cidade.' },
  { k:'ori', t:'O cerro e o que veio antes',
    r:'Os morros da região eram marcos de orientação muito antes do balneário.',
    d:'As elevações da costa — Pan de Azúcar e San Antonio entre elas — servem de referência visual a quem navega e a quem anda por terra. Eram pontos conhecidos pelos povos que percorriam a costa, e continuaram sendo depois, por marinheiros e viajantes.',
    q:'Por que morros isolados têm importância numa costa plana?',
    a:'Servem de referência para orientação, por serem visíveis de longe',
    b:'Porque protegem a cidade do vento',
    ok:'a',
    porque:'Num relevo de coxilhas suaves, qualquer elevação vira marco. Antes de mapa e bússola de uso comum, navegar e caminhar dependia de reconhecer formas no horizonte.',
    quase:'A proteção contra o vento é limitada; o valor histórico desses morros é como ponto de referência visível a quilômetros.' }]},

{ id:'u4', n:'04', alt:'mar', altn:'rio vira mar', cor:'var(--pacifico)', ico:'onda', x:1090, y:490, filma:true,
  h:'Onde exatamente o rio vira mar?', local:'Punta del Este',
  res:'Numa península estreita que avança para o sul. De um lado, a Playa Mansa, de água calma e cor de rio. Do outro, a Playa Brava, de onda e água do Atlântico. A linha entre os dois é oficial — e dá para atravessá-la a pé.',
  pontos:[
  { k:'geo', t:'Duas praias, dois corpos de água',
    r:'Mansa de um lado, Brava do outro — na mesma língua de terra.',
    d:'A península separa o estuário do oceano aberto. Na face oeste, a água do Río de la Plata chega mansa, mais quente e turva. Na face leste, o Atlântico bate com onda, mais frio e mais claro. Os nomes das praias não são poéticos: são descritivos, e qualquer pessoa sente a diferença entrando na água.',
    q:'Por que duas praias tão próximas são tão diferentes?',
    a:'Porque uma dá para o estuário e a outra para o oceano aberto',
    b:'Porque uma é natural e a outra foi construída',
    ok:'a',
    porque:'É a conclusão de toda a temporada: a água que a gente acompanhou desde Colonia termina aqui e dá lugar ao Atlântico. A península é o divisor, e os dois lados são dois mundos físicos distintos.',
    quase:'As duas são naturais. O que as separa é a massa de água que cada uma recebe.' },
  { k:'cul', t:'A linha oficial',
    r:'Existe um marco que define onde termina o rio e começa o oceano.',
    d:'A divisa entre o Río de la Plata e o Atlântico foi estabelecida por acordo, com um ponto de referência na costa uruguaia. Dizer onde um corpo d\\u2019água termina e outro começa não é uma evidência da natureza: é uma decisão — jurídica, com consequências sobre pesca, navegação e jurisdição.',
    q:'Como se decide onde termina um rio e começa o oceano?',
    a:'Por acordo entre países, com um marco definido',
    b:'Pela cor da água, que muda visivelmente',
    ok:'a',
    porque:'A natureza faz uma transição gradual; a lei precisa de uma linha. É o mesmo mecanismo da fronteira Chile-Argentina pelo divisor de águas: a geografia sugere, mas quem traça é o acordo.',

var AR_CONTEXTO = [
{ id:'a-c1', tag:'Antes da chegada dos europeus', cor:'var(--andino)', ico:'bussola',
  h:'O que havia numa planície que parecia vazia?',
  sub:'A pampa antes do gado',
  res:'Sem montanha, sem pedra, sem floresta: os europeus olharam a pampa e viram nada. Era uma das terras mais férteis do planeta, percorrida por povos que se moviam com as estações.',
  pontos:[
  { k:'ori', t:'Quem percorria a planície',
    r:'Querandi na pampa, guarani nos rios, charrua na outra margem, tehuelche no sul.',
    d:'Eram povos de deslocamento: seguiam a caça e as estações por centenas de quilômetros, sem cidade fixa. Mais tarde, mapuche cruzam a cordilheira e se estabelecem também deste lado — os mesmos da temporada do Chile, agora dos dois lados dos Andes.',

    a:'Porque o modo de vida acompanhava a caça e as estações',

    porque:'Numa planície de recursos espalhados, mover-se é mais eficiente que fixar-se. Não é ausência de capacidade: é uma resposta adequada àquela geografia — a mesma lógica que, no Chile, fez os mapuche viverem em lof sem capital.',
    quase:'Técnica havia, e sofisticada: cerâmica, tecelagem, manejo do fogo. O que não havia era razão para fixar-se onde o recurso se desloca.' },

    ok:'a',
    porque:'Estuário é a zona onde o rio encontra o mar e as águas se misturam. Aqui ela é tão extensa que foi preciso definir por acordo onde termina — e esse ponto é a última parada da temporada do Uruguai.',
    quase:'Fechado não é: desemboca direto no Atlântico, e a maré oceânica se faz sentir rio acima.' },
  { k:'cul', t:'Sem cidade para tomar',

    a:'Povos móveis, sem centro político nem tesouro acumulado',
    b:'Um império organizado, como o inca',
    ok:'a',
    porque:'Sem ouro e sem capital, a região não interessava à Coroa. Foi por isso que ficou marginal por quase dois séculos — e só virou prioridade quando a terra, e não o metal, passou a valer.',
    quase:'Impérios houve na América, mas não aqui: o Tawantinsuyu ficava a milhares de quilômetros, nos Andes.' },
  { k:'lin', t:'Pampa',
    r:'A palavra que nomeia a região mais argentina de todas é quíchua.',
    d:'Significa planície. Veio dos Andes com os povos que desciam a cordilheira e entrou no espanhol como se sempre tivesse estado lá. É o mesmo padrão da chupalla chilena: o símbolo nacional carrega um nome indígena que quase ninguém reconhece como tal.',
    q:'De onde vem a palavra "pampa"?',
    a:'Do quíchua, língua andina anterior à chegada europeia',

    ok:'a',

{ id:'a-c2', tag:'A colonização', cor:'var(--cobre)', ico:'espada',
  h:'Como se coloniza uma terra sem ouro?',
  sub:'1536 · 1816',
  res:'Buenos Aires foi fundada duas vezes e abandonada uma. Sem metal para extrair, a Espanha quase desistiu da região — até descobrir que a riqueza estava no chão, não embaixo dele.',
  pontos:[
  { k:'cul', t:'Duas fundações',
    r:'1536: fracassa. 1580: fica.',
    d:'Pedro de Mendoza funda Buenos Aires em 1536. A resistência querandi e a fome acabam com o assentamento, e os sobreviventes partem. Só 44 anos depois a cidade é refundada, e desta vez resiste. É o mesmo padrão de Santiago, no Chile: a fundação que os livros contam com uma data teve, na prática, mais de uma.',
    q:'Por que a primeira Buenos Aires não sobreviveu?',
    a:'Resistência indígena e falta de alimento',
    b:'Uma enchente do estuário',
    ok:'a',
    porque:'Sem produção própria e enfrentando os querandi, o assentamento não se sustentou. Como em Santiago, a cidade europeia não se instalou de primeira — foi disputada.',
    quase:'O rio não destruiu o assentamento. O que o inviabilizou foi a combinação de resistência armada e fome.' },
  { k:'lin', t:'A prata que nunca houve',
    r:'O rio e o país levam o nome de um metal que não estava ali.',
    d:'Os primeiros europeus ouviram falar de montanhas de prata subindo o rio. A prata existia — mas no Peru, a milhares de quilômetros. O nome ficou: Río de la Plata, e depois Argentina, do latim <em>argentum</em>. Um país inteiro batizado com a expectativa de quem chegou.',
    q:'O que o nome do país registra?',
    a:'O que os colonizadores esperavam encontrar',
    b:'Os recursos que o território de fato tinha',
    ok:'a',
    porque:'A riqueza argentina veio da terra — carne e grãos —, não do metal. O nome aponta para uma expedição que buscou e não achou. Mesmo mecanismo de Isla Negra, no Chile: topônimos registram olhares, não fatos.',
    quase:'Prata não houve em quantidade. O que o território tinha era um dos solos mais férteis do mundo, e isso levou dois séculos para ser percebido como riqueza.' },
  { k:'geo', t:'O gado solto',
    r:'Alguns animais escapados viraram milhões em pouco mais de um século.',
    d:'O gado trazido pelos espanhóis encontrou pasto infinito e nenhum predador grande. Multiplicou-se solto pela planície, e durante muito tempo a economia foi sair a campo, matar pelo couro e deixar a carne. A terra virou riqueza sem que ninguém a cultivasse.',
    q:'O que transformou a pampa em economia?',
    a:'O gado europeu solto, que se multiplicou sem limite natural',
    b:'A descoberta de minas na planície',
    ok:'a',
    porque:'Foi o encontro entre um animal trazido de fora e um ecossistema sem predador à altura. A Espanha procurou metal e acabou criando, sem planejar, uma potência pecuária.',
    quase:'Não há minas na pampa. A riqueza sempre esteve na superfície — no pasto e, depois, no solo agrícola.' },
  { k:'ori', t:'O cavalo muda tudo',
    r:'Os povos da planície adotaram o cavalo europeu e mudaram o próprio modo de vida.',
    d:'O cavalo, trazido pelos espanhóis, espalhou-se pela pampa e foi incorporado pelos povos originários, que se tornaram exímios cavaleiros. Isso ampliou o alcance da caça e a capacidade de resistir — e manteve a fronteira interna em disputa por mais de dois séculos. Como Lautaro no Chile, o aprendizado virou arma.',
    q:'O que o cavalo representou para os povos da pampa?',
    a:'Uma tecnologia adotada que ampliou mobilidade e capacidade de resistência',
    b:'Um animal que eles evitaram por ser estrangeiro',
    ok:'a',
    porque:'É o mesmo movimento de Lautaro, na temporada do Chile: a ferramenta do invasor foi aprendida e usada contra ele. A resistência não foi só recusa — foi adaptação inteligente.',
    quase:'Longe de evitar, incorporaram o cavalo ao ponto de a cultura equestre da pampa se tornar inseparável deles.' }]},

{ id:'a-c3', tag:'O resultado', cor:'var(--valle)', ico:'mesa',
  h:'O que faz da Argentina o que ela é hoje?',
  sub:'Imigração, carne e uma dívida aberta',
  res:'Entre 1870 e 1930 o país recebeu milhões de imigrantes e se refez. Na mesma década em que convidava uns, expulsava outros.',
  pontos:[
  { k:'cul', t:'Um país refeito pela imigração',
    r:'Italianos, espanhóis, sírio-libaneses, judeus, galeses, japoneses.',
    d:'A população multiplicou em poucas décadas, e Buenos Aires virou uma cidade onde a maioria havia nascido em outro lugar. Dali saíram o tango, a pizza argentina e o lunfardo — invenções que não existem na Itália nem na Espanha, porque são do encontro.',
    q:'O que surge quando a maioria de uma cidade nasceu fora?',
    a:'Uma cultura nova, que não existia em nenhum dos lugares de origem',
    b:'A cultura do país de origem majoritário, transplantada',
    ok:'a',
    porque:'O tango não é italiano nem espanhol nem africano, e tem de todos. É o mesmo raciocínio da empanada chilena: o encontro produz algo terceiro, que não é a soma das partes.',
    quase:'Transplante não houve: a cultura italiana na Argentina é diferente da italiana na Itália, justamente por ter se misturado.' },
  { k:'lin', t:'Lunfardo e voseo',
    r:'A gíria portenha entrou pelo porto; o vos substituiu o tú.',
    d:'Laburar vem do italiano <em>lavorare</em>. Mina, bondi, fiaca: o vocabulário cotidiano guarda a imigração. E o voseo — vos no lugar de tú — é marca das duas margens do rio, compartilhada com o Uruguai.',
    q:'Qual língua mais marcou o espanhol portenho?',
    a:'O italiano, pela imigração massiva',
    b:'O inglês',
    ok:'a',
    porque:'A imigração italiana foi a maior, e atravessou para a fala comum. Quem fala portenho fala, sem saber, um pouco de italiano todos os dias.',
    quase:'O inglês deixou marcas em esporte e comércio, mas a base do lunfardo é italiana.' },
  { k:'ori', t:'A conta que ficou aberta',
    r:'Enquanto a imigração era incentivada, a Patagônia era ocupada à força.',
    d:'Entre 1878 e 1885, a Campanha do Deserto ocupou militarmente o sul e desalojou os povos originários. É o paralelo exato da Ocupação da Araucanía chilena, na mesma década: dois Estados independentes concluindo o que a colônia não concluiu. E o nome escolhido repete o truque: chamar de "deserto" um território habitado.',
    q:'O que a palavra "deserto" faz nesse nome?',
    a:'Apaga quem vivia ali, transformando ocupação em descoberta',
    b:'Descreve com precisão o clima da Patagônia',
    ok:'a',
    porque:'É o mesmo mecanismo de "Pacificação", no Chile. Quem escolhe a palavra escolhe quem é o agressor — e aqui a escolha foi declarar vazio o que estava ocupado.',
    quase:'A Patagônia tem estepe, não deserto absoluto — e, sobretudo, tinha gente. O termo serve ao argumento, não à geografia.' },
  { k:'geo', t:'A terra ainda manda',
    r:'Carne, trigo, milho e soja continuam saindo pelo mesmo porto.',
    d:'A pampa segue sendo a base da economia, e Buenos Aires segue sendo a porta. A concentração num produto e numa saída marca a história econômica do país até hoje, com os ciclos de bonança e crise que vêm junto.',
    q:'O que a Argentina exporta hoje tem relação com a colonização?',
    a:'Sim: a mesma terra e o mesmo porto, com outros produtos',
    b:'Não: a economia mudou completamente de base',
    ok:'a',
    porque:'O gado solto do século XVII e a soja de hoje saem da mesma planície pelo mesmo estuário. É a pergunta que a série faz em toda temporada: o que sai daqui, e para onde vai?',
    quase:'Os produtos mudaram, mas a estrutura — terra fértil, porto único, exportação primária — é reconhecível desde a colônia.' }]}
];

var AR_TRILHA = [
{ id:'a0', n:'01', alt:'3.025 m', altn:'onde paramos', cor:'var(--andino-2)', ico:'neve', x:92, y:342, filma:true,
  h:'O que há do outro lado da montanha?', local:'Valle Nevado · a mesma cordilheira do Chile',
  res:'A temporada do Chile terminou aqui ao lado, em El Colorado. Valle Nevado fica no mesmo cordão de montanhas — e é daqui que a gente atravessa para o outro lado e começa a descer.',
  pontos:[
  { k:'geo', t:'A mesma montanha, dois países',
    r:'El Colorado, Farellones e Valle Nevado dividem o mesmo vale.',
    d:'São três centros vizinhos, a poucos quilômetros uns dos outros, na mesma bacia. Dali a cordilheira segue para leste e vira fronteira: o critério acordado no século XIX foi o <strong>divisor de águas</strong> — de que lado a água escorre. E essa água é o que importa de verdade. A neve que cai aqui abastece Santiago e as parreiras do Maipo de um lado, e os canais de Mendoza do outro. A montanha é a caixa d\u2019água de dois países.',
    q:'Como Chile e Argentina decidiram onde ficaria a fronteira?',
    a:'Seguindo a linha das cumeeiras mais altas da cordilheira',
    b:'Dividindo o território ao meio em linha reta',
    ok:'a',
    porque:'O critério foi o divisor de águas: de que lado a água escorre. É um limite que a própria montanha desenha — e que gerou disputas justamente onde a cumeeira e o divisor não coincidem.',
    quase:'Linhas retas existem em outras fronteiras da América, mas aqui o critério foi o relevo — o que torna a montanha, literalmente, o documento.' },
  { k:'cul', t:'A estrada manda',
    r:'A G-21 é mão única por horário: sobe de manhã, desce de tarde.',
    d:'A estrada que liga Santiago a Farellones, El Colorado e Valle Nevado tem dezenas de curvas numeradas e largura para um sentido só. Nos fins de semana de inverno, o Ministério dos Transportes inverte o fluxo por horário — subida das 8h às 13h, descida das 15h às 20h — e em alguns trechos exige corrente nos pneus. Do lado argentino a solução é outra: lá se exige <strong>portar</strong> correntes durante todo o inverno, mesmo sem neve, e a Gendarmería barra quem não tiver.',
    q:'Por que dois países vizinhos resolvem o mesmo problema de formas diferentes?',
    a:'Porque o Chile regula o horário e a Argentina regula o equipamento',
    b:'Porque na Argentina não neva o bastante para haver regra',
    ok:'a',
    porque:'A mesma montanha impõe o mesmo risco, e cada país escolheu um instrumento: um organiza o tempo de uso da via, o outro obriga o motorista a carregar o equipamento. Comparar as duas soluções é um jeito de ver que a lei responde à geografia — mas não há uma resposta única.',
    quase:'Neva muito do lado argentino, e as rotas chegam a ser fechadas por temporal. A diferença está no tipo de regra, não na quantidade de neve.' },
  { k:'ori', t:'A travessia é antiga',
    r:'Os passos dos Andes eram rota conhecida muito antes da fronteira existir.',
    d:'Povos dos dois lados cruzavam para trocar, negociar e casar, e a rede de caminhos incas chegava até aqui. A fronteira entre Chile e Argentina é do século XIX; a travessia é milenar. Fazer esse caminho hoje é repetir um trajeto que já era rotina.',
    q:'A cordilheira separava os povos originários?',
    a:'Não: havia passos conhecidos e rotas de troca regulares',
    b:'Sim: era intransponível antes da estrada',
    ok:'a',
    porque:'A montanha ligava. É a mesma conclusão da aula do Cajón del Maipo — e os laços de parentesco entre comunidades dos dois lados seguem reconhecidos hoje.',
    quase:'Atravessar era difícil e sazonal, mas rotineiro. Havia passos mapeados e um calendário para usá-los.' },
  { k:'lin', t:'Do outro lado, a mesma língua',
    r:'Cruzar a fronteira não muda o idioma — muda o sotaque.',
    d:'Espanhol dos dois lados, com diferenças de entonação e vocabulário. Mas há uma mudança concreta: aqui começa o voseo generalizado, que a Argentina e o Uruguai usam no dia a dia e o Chile reserva para registros informais. A língua se transforma por gradiente, não por salto.',
    q:'O que acontece com a língua ao se cruzar a cordilheira?',
    a:'Muda gradualmente, em sotaque e vocabulário',

    porque:'Fronteiras políticas são linhas; fronteiras linguísticas são faixas. O espanhol vai mudando aos poucos, e o viajante percebe antes pelo ouvido do que pela placa.',
    quase:'Os dois países falam espanhol. O que muda é o modo — pronúncia, tratamento, gíria — e isso muda aos poucos.' }]},

  { k:'cul', t:'A passagem',

    d:'O passo internacional fecha com frequência no inverno. A ferrovia transandina foi uma obra monumental do século XIX e hoje está desativada. Atravessar a cordilheira nunca deixou de ser uma decisão séria.',

  { k:'ori', t:'Caminho antes da estrada',

    ok:'a',
    porque:'A montanha ligava, não separava — é a mesma conclusão da aula do Cajón del Maipo. Os parentescos entre os dois lados continuam reconhecidos hoje.',
    quase:'Cruzar era difícil, mas rotineiro: havia passos conhecidos e calendário para usá-los.' },
  { k:'lin', t:'Aconcágua',
    r:'O nome vem provavelmente do quíchua ou do mapudungun.',
    d:'Entre as explicações mais citadas estão Ackon Cahuak, "sentinela de pedra", e raízes mapudungun ligadas ao rio Aconcágua, do lado chileno. A montanha mais alta das Américas leva um nome que não é espanhol nem português.',
    q:'O que o nome do pico mais alto da América mostra?',
    a:'Que a nomeação do continente é anterior à chegada europeia',
    b:'Que foi batizado por alpinistas do século XIX',
    ok:'a',
    porque:'Os acidentes maiores do continente já tinham nome. É a mesma lição de Huelén, no Chile: o mapa europeu foi desenhado sobre uma toponímia que já existia.',
    quase:'Os alpinistas registraram e difundiram o nome, mas não o criaram — ele é anterior e de origem indígena.' }]},

{ id:'a6', planejada:true, n:'03', alt:'750 m', altn:'o oásis', cor:'var(--cobre)', ico:'uva', x:352, y:470,
  h:'Como se planta num deserto?', local:'Mendoza · pé dos Andes',
  res:'Mendoza chove menos de 250 mm por ano — menos que muitos desertos. E é a maior região vinícola da América do Sul, graças a um sistema de canais herdado dos huarpe.',
  pontos:[
  { k:'ori', t:'Os canais huarpe',
    r:'A irrigação de Mendoza é anterior à chegada espanhola.',
    d:'O povo huarpe já conduzia a água do degelo andino por canais para irrigar seus cultivos. Os espanhóis encontraram o sistema funcionando e o ampliaram. A vinha que hoje dá fama à região bebe de uma engenharia indígena.',
    q:'Quem construiu o primeiro sistema de irrigação de Mendoza?',
    a:'Os huarpe, antes da chegada espanhola',
    b:'Imigrantes italianos no século XIX',
    ok:'a',
    porque:'É o mesmo achado do Valle del Maipo, na temporada do Chile: a água já era domada quando os europeus chegaram. A viticultura moderna foi construída sobre infraestrutura herdada.',
    quase:'Os italianos trouxeram cepas e técnicas de vinificação — mas a água já chegava à terra por canais muito mais antigos.' },
  { k:'geo', t:'Sombra de chuva',
    r:'Os Andes barram a umidade do Pacífico e deixam Mendoza seca.',
    d:'As nuvens que vêm do oceano descarregam no lado chileno e chegam secas do lado argentino. É o efeito de sombra de chuva — e explica por que dois lugares tão próximos, separados só pela cordilheira, têm climas opostos.',
    q:'Por que o lado argentino dos Andes é mais seco que o chileno?',
    a:'Porque a montanha retém a umidade que vem do Pacífico',
    b:'Porque está mais longe do equador',
    ok:'a',
    porque:'A mesma cordilheira que na temporada do Chile dava neve, aqui produz deserto. Uma formação, dois climas — dependendo de que lado se está.',
    quase:'A latitude é praticamente a mesma dos dois lados. O que muda é a posição em relação à montanha.' },
  { k:'cul', t:'Água como lei',
    r:'Em Mendoza, o direito à água é regulado desde o século XIX.',
    d:'Numa região onde tudo depende do degelo, a água virou questão jurídica. Há instituições próprias para administrá-la, e o calendário agrícola se organiza em torno da distribuição. O tema conversa direto com o Cajón del Maipo, do outro lado.',
    q:'Por que a água é tema jurídico em Mendoza?',
    a:'Porque é escassa e precisa ser distribuída entre muitos usuários',
    b:'Porque há excesso e é preciso drená-la',
    ok:'a',
    porque:'Recurso escasso com muitos interessados exige regra. Mendoza criou instituições para isso — e elas moldam quem planta o quê, e onde.',
    quase:'Excesso é o oposto do problema: chove menos de 250 mm por ano, menos que em muitos desertos.' },
  { k:'lin', t:'Nomes de água',
    r:'A toponímia da região guarda as línguas de quem administrava a água.',
    d:'Nomes de canais, rios e povoados carregam raízes huarpe e quíchua. Onde a água é o recurso central, ela organiza também o vocabulário — e os nomes resistem mesmo quando as línguas se perdem.',
    q:'Por que os nomes de lugar costumam sobreviver às línguas que os criaram?',
    a:'Porque são usados todos os dias por todos, inclusive por quem chega',
    b:'Porque são protegidos por lei',
    ok:'a',
    porque:'Um nome de lugar é a palavra mais repetida de um território. Ele atravessa a troca de idioma porque é mais prático manter do que rebatizar — e por isso vira arquivo.',
    quase:'Proteção legal existe em alguns casos, mas a sobrevivência vem do uso cotidiano, não da norma.' }]},

{ id:'a8', planejada:true, n:'04', alt:'~100 m', altn:'a planície', cor:'var(--valle-2)', ico:'uva', x:502, y:504,
  h:'O que uma planície sem fim faz com um povo?', local:'A pampa · interior argentino',
  res:'Centenas de quilômetros sem um morro. A terra mais fértil do continente produziu riqueza, um tipo humano — o gaucho — e um país que depende do que planta.',
  pontos:[
  { k:'geo', t:'Terra sem relevo',
    r:'Solo profundo e fértil, formado por sedimento acumulado durante milênios.',
    d:'A pampa é um dos solos mais produtivos do planeta. Sem montanha para barrar o vento nem pedra para atrapalhar o arado, ela se tornou a base da economia argentina: carne, trigo, milho e soja.',
    q:'Por que a pampa é tão produtiva?',
    a:'Solo profundo de sedimento, clima temperado e terreno plano',
    b:'Por causa de fertilizantes importados',
    ok:'a',
    porque:'A fertilidade é natural e anterior a qualquer técnica moderna. Foi ela que atraiu a pecuária, a imigração e, depois, a agricultura em escala.',
    quase:'Os insumos aumentam a produtividade, mas a base é o solo — formado por acúmulo de sedimento ao longo de milênios.' },
  { k:'cul', t:'O gaucho',
    r:'O tipo humano que a planície produziu — e que o país adotou como símbolo.',
    d:'Cavalo, gado e distância criaram um modo de vida próprio, depois transformado em emblema nacional pela literatura. O paralelo com o huaso chileno é direto: os dois são trabalhadores rurais que viraram símbolo de identidade.',
    q:'O que o gaucho e o huaso chileno têm em comum?',
    a:'Ambos são trabalhadores rurais transformados em símbolo nacional',
    b:'Ambos são figuras inventadas pela literatura, sem base real',
    ok:'a',
    porque:'Os dois existiram como trabalhadores antes de virarem emblema. A literatura e a festa nacional os converteram em identidade — um processo que vale examinar em vez de aceitar.',
    quase:'A literatura os estilizou, mas partiu de gente real: homens do campo, com função econômica concreta.' },
  { k:'ori', t:'A fronteira interna',
    r:'A pampa também foi território indígena, e a expansão da cerca foi um avanço militar.',
    d:'A ocupação da planície pelo gado e pela cerca empurrou os povos originários para o sul, até a Campanha do Deserto fechar a conta na década de 1880. O mesmo processo da Araucanía chilena, com outro nome e a mesma década.',
    q:'O que a cerca representou na pampa?',
    a:'O fim do deslocamento livre dos povos que viviam ali',
    b:'Apenas uma melhoria técnica da pecuária',
    ok:'a',
    porque:'A cerca transformou território percorrido em propriedade delimitada. É uma tecnologia que redesenha quem pode estar onde — e foi usada exatamente para isso.',
    quase:'Tecnicamente a cerca organizou o rebanho, mas o efeito histórico foi territorial: dividir e excluir.' },
  { k:'lin', t:'Palavras do campo',
    r:'Pampa vem do quíchua: planície.',
    d:'A palavra que nomeia a região mais argentina de todas é indígena, como chupalla no Chile. E muitos termos do campo — do arreio à comida — vêm do quíchua e do guarani, trazidos por quem já estava aqui.',
    q:'Por que tantos termos do campo argentino vêm do quíchua e do guarani?',
    a:'Porque descrevem coisas que já existiam aqui quando os europeus chegaram',
    b:'Porque foram adotados por moda no século XX',
    ok:'a',
    porque:'Plantas, animais, acidentes do terreno e técnicas de trabalho já tinham nome. O espanhol incorporou o vocabulário de quem conhecia o lugar — e por isso o campo mais "argentino" fala, sem saber, línguas indígenas.',
    quase:'Não é moda nem resgate recente: são palavras incorporadas no próprio contato colonial, há séculos, e nunca substituídas.' }]},

{ id:'a1', filma:true, n:'05', alt:'0 m', altn:'o porto', cor:'var(--pacifico)', ico:'onda', x:640, y:512,
  h:'Como um porto vira um país?', local:'Buenos Aires · Río de la Plata',
  res:'Entre 1870 e 1930 a Argentina recebeu milhões de imigrantes. Quase todos entraram por aqui — e a cidade, a comida e o jeito de falar nunca mais foram os mesmos.',
  pontos:[
  { k:'cul', t:'A grande imigração',
    r:'Italianos, espanhóis, sírio-libaneses, judeus, galeses, japoneses.',
    d:'Em algumas décadas, a população do país multiplicou. Buenos Aires virou uma cidade onde a maioria tinha nascido em outro lugar — e isso moldou a comida, a música e a própria língua.',
    q:'O que acontece com uma cidade em que a maioria nasceu fora?',
    a:'Ela mantém exatamente a cultura anterior',
    b:'Ela produz uma cultura nova, que não existia em nenhum dos lugares de origem',
    ok:'b',
    porque:'O tango, a pizza argentina e o lunfardo não existem na Itália nem na Espanha. São invenções do encontro — como a empanada, na temporada do Chile.',
    quase:'Manter o anterior seria impossível com essa escala. O que houve foi transformação, não conservação.' },
  { k:'lin', t:'Lunfardo',
    r:'A gíria portenha nasceu da mistura de italiano, espanhol e línguas de porto.',
    d:'Palavras como laburar (trabalhar, do italiano lavorare) ou mina (mulher) entraram pelo porto e ficaram. E o voseo — o vos no lugar do tú — é marca registrada do falar argentino.',
    q:'De onde vem a maior parte do lunfardo?',
    a:'Do italiano trazido pelos imigrantes',
    b:'Do inglês',
    ok:'a',
    porque:'A imigração italiana foi a maior, e a língua dela atravessou para a fala cotidiana. Quem fala portenho fala, sem saber, um pouco de italiano.',
    quase:'O inglês deixou marcas em esportes e comércio, mas a base do lunfardo é italiana.' },
  { k:'ori', t:'Quem não entrou na foto',
    r:'A imigração europeia foi política de Estado — e teve contrapartida.',
    d:'Enquanto o país se promovia na Europa, a Campanha do Deserto (1878–1885) ocupava militarmente a Patagônia e desalojava os povos originários. A mesma década que celebra a chegada de uns é a que expulsa outros.',
    q:'O que aconteceu na Patagônia enquanto a imigração era incentivada?',
    a:'Uma campanha militar que desalojou os povos originários',
    b:'Nada de relevante; a região seguiu como estava',
    ok:'a',
    porque:'A Campanha do Deserto é o paralelo argentino da Ocupação da Araucanía chilena — dois Estados independentes concluindo, no mesmo período, o que a colônia não concluiu.',
    quase:'Foi a transformação mais violenta da região no século XIX: o território passou a ser do Estado e as comunidades foram deslocadas.' },
  { k:'geo', t:'Por que aqui',
    r:'Uma cidade nasce onde o rio encontra o mar.',
    d:'Buenos Aires não tem montanha, nem baía abrigada, nem pedra alta. Tem um estuário navegável que leva ao interior do continente. Toda a economia argentina — carne, trigo, soja — sai por aqui.',
    q:'O que fez de Buenos Aires o centro do país?',
    a:'Ser o ponto de saída da produção de todo o interior',
    b:'Ser a região mais fértil da Argentina',
    ok:'a',
    porque:'A fertilidade está na pampa, no interior. O que a capital tem é a porta: o porto por onde tudo o que a terra produz atravessa para o mundo.',
    quase:'A terra mais fértil fica a centenas de quilômetros daqui. A cidade é a saída, não a origem.' }]},

{ id:'a5', filma:true, n:'06', alt:'0 m', altn:'o delta', cor:'var(--valle)', ico:'agua', x:752, y:512, filma:true,
  h:'Onde um rio constrói terra nova?', local:'Tigre · delta do Paraná',
  res:'O Paraná chega carregando a terra que arrancou de milhares de quilômetros acima. Aqui ele a deposita — e fabrica ilhas. O delta cresce alguns metros por ano, e há gente morando nessa terra em formação.',
  pontos:[
  { k:'geo', t:'Terra em construção',
    r:'O delta avança rumo ao rio porque o sedimento não para de chegar.',
    d:'Tudo o que vimos descendo — a neve que virou rio, o rio que atravessou a planície — termina aqui em forma de barro. Quando a correnteza perde força perto da foz, o sedimento assenta e forma bancos, depois ilhas. É um dos poucos deltas do mundo que deságua em água doce, não no mar.',
    q:'De onde vem a terra que forma as ilhas do delta?',
    a:'Do sedimento arrancado rio acima, ao longo de milhares de quilômetros',
    b:'De aterro construído por máquinas',
    ok:'a',
    porque:'O rio funciona como uma esteira: desgasta a terra lá em cima e a deposita aqui embaixo. A paisagem que a gente atravessou nesta temporada está, literalmente, chegando ao delta em forma de barro.',
    quase:'Há obras pontuais, mas a formação das ilhas é natural e contínua — o delta cresce sozinho, vários metros por ano.' },
  { k:'cul', t:'Casas sobre palafitas',
    r:'Quem mora nas ilhas constrói acima da água e se desloca de barco.',
    d:'Não há rua: há canal. O ônibus é lancha, o mercado é um barco que passa, e a escola se alcança navegando. As casas de madeira ficam erguidas sobre estacas, porque a enchente faz parte do calendário, não é exceção.',
    q:'Por que as casas do delta ficam erguidas sobre estacas?',
    a:'Porque a enchente é rotina, não acidente',
    b:'Por tradição decorativa',
    ok:'a',
    porque:'Quem vive num delta organiza a vida em torno do nível da água. Erguer a casa não é precaução excepcional: é a forma de morar num lugar que alaga com regularidade.',
    quase:'A estética existe, mas a razão é prática e antiga: manter a casa seca quando o rio sobe.' },
  { k:'ori', t:'Quem navegava primeiro',
    r:'Os guarani já percorriam estes canais muito antes do remo esportivo.',
    d:'O delta era rota de canoa e lugar de pesca para os povos do rio. A palavra <em>Paraná</em> vem do guarani e é geralmente traduzida como "parente do mar" ou "rio grande como mar" — um nome que descreve a largura antes de qualquer europeu medi-la.',
    q:'O que o nome "Paraná" descreve?',
    a:'A largura do rio, comparada ao mar',
    b:'A cor da água',
    ok:'a',
    porque:'É o mesmo tipo de nomeação que a gente viu no Chile com Huelén: o nome indígena descreve a experiência do lugar. Aqui, a de um rio tão largo que parece mar — e é exatamente o que o Río de la Plata é.',
    quase:'A cor vem do sedimento e impressiona, mas o nome aponta para o tamanho, não para o tom.' },
  { k:'lin', t:'Tigre sem tigre',
    r:'O nome vem de um felino que nunca foi tigre.',
    d:'A região recebeu o nome por causa das onças — <em>yaguareté</em>, em guarani — que os colonizadores chamavam de "tigres" por falta de palavra própria. O animal sumiu da região; o nome ficou. É o mesmo mecanismo de Isla Negra, no Chile: um topônimo que registra o olhar de quem chegou.',
    q:'Por que o lugar se chama Tigre se não há tigres na América?',
    a:'Porque os colonizadores chamavam a onça de tigre',
    b:'Porque havia tigres trazidos da Ásia',
    ok:'a',
    porque:'Quem chega nomeia com as palavras que trouxe. Faltando termo para a onça, usaram o do animal mais parecido que conheciam — e o engano virou nome oficial.',
    quase:'Nunca houve tigres asiáticos soltos aqui. O que havia era onça-pintada, abundante na região.' }]},

{ id:'a2', filma:true, n:'07', alt:'travessia', altn:'o ferry · fim da temporada', cor:'var(--sol)', ico:'onda', x:874, y:512, ferry:true,
  h:'Como se atravessa um rio que parece mar?', local:'Río de la Plata · ferry para o Uruguai',
  res:'Uma hora e pouco de barco, e muda o país. Mas a paisagem que se vê da popa é a mesma — porque a fronteira é política, não geográfica.',
  pontos:[
  { k:'geo', t:'Água doce cor de barro',
    r:'O rio carrega tanto sedimento que a água é marrom até o oceano.',
    d:'O Paraná desce atravessando milhares de quilômetros de terra e chega aqui carregado. Por isso o Río de la Plata não é azul: é da cor da terra que ele trouxe. Quem olha da popa vê a planície argentina escorrendo para o mar.',
    q:'Por que a água do rio é marrom?',
    a:'Por poluição das cidades',
    b:'Por sedimento trazido de milhares de quilômetros de terra',
    ok:'b',
    porque:'É terra em suspensão, não sujeira. O rio é um sistema que transporta a planície para o oceano — e vai depositando, formando novas ilhas no delta.',
    quase:'Há poluição, como em todo grande estuário urbano, mas a cor vem do sedimento natural do Paraná.' },
  { k:'cul', t:'Fronteira sem cerca',
    r:'A travessia muda o país sem mudar a paisagem.',
    d:'Dos dois lados do rio se toma mate, se come carne assada e se fala espanhol com voseo. A fronteira é uma linha no mapa, não uma mudança no terreno — e é isso que torna a travessia uma boa aula sobre o que separa, de fato, dois países.',
    q:'O que separa Argentina e Uruguai?',
    a:'Uma fronteira histórica e política, não uma diferença de paisagem',
    b:'Uma mudança clara de clima e vegetação',
    ok:'a',
    porque:'A pampa continua do outro lado. O que faz dois países são decisões humanas — guerras, tratados, acordos — e não a geografia, que aqui é contínua.',
    quase:'O clima e a vegetação são praticamente os mesmos nas duas margens. A diferença é de história, não de terreno.' },
  { k:'ori', t:'Os charrua',
    r:'O povo que habitava a margem oriental, hoje presente no nome e na memória.',
    d:'Os charrua ocupavam o território que viria a ser o Uruguai. Foram dizimados no século XIX, num episódio que o país reconhece hoje como massacre. O termo "garra charrua", usado no futebol uruguaio, carrega o nome de um povo que o Estado tentou apagar.',
    q:'O que o uso da expressão "garra charrua" revela?',
    a:'Que o nome de um povo virou símbolo nacional depois de sua eliminação',
    b:'Que os charrua foram homenageados em vida',
    ok:'a',
    porque:'É um padrão que se repete na América: o povo é eliminado e o nome é adotado como emblema. Vale comparar com a chupalla chilena — mas ali a herança é de cultura, aqui é de nome sobre ausência.',
    quase:'Homenagem em vida não houve: o reconhecimento vem muito depois, e a apropriação do nome é anterior a ele.' },
  { k:'lin', t:'Mate, che e vos',
    r:'As duas margens compartilham palavras que o resto do espanhol não tem.',
    d:'Mate vem do quíchua mati, a cuia. Che é interjeição de chamada, possivelmente de origem guarani ou mapudungun. E o voseo — vos em vez de tú — é a marca das duas margens. A língua não respeita a fronteira que o mapa desenha.',
    q:'O que o vocabulário compartilhado mostra?',
    a:'Que a cultura é contínua onde o mapa marca uma divisão',
    b:'Que o Uruguai copiou o modo de falar argentino',
    ok:'a',
    porque:'As duas margens formavam uma região só antes de serem dois países. A língua guardou a unidade que a política dividiu.',
    quase:'Não é cópia: é origem comum. Os dois falares vêm do mesmo caldo rio-platense, anterior às independências.' }]}
];

 {ar:1, ic:'barra',  x:330,  y:500, c:'#C94A12', q:'Água é lei',       t:'Mendoza chove menos de 250 mm por ano. A irrigação vem de canais huarpe, anteriores à chegada espanhola.'}

      var prox = proxima(a);
      $('#premio-txt').textContent = prox
        ? 'Você completou os quatro pontos. A próxima parada é ' + (prox.local || prox.sub) + '.'
        : 'Você completou os quatro pontos desta aula.';
      var ac = $('#premio-acoes'); ac.innerHTML = '';
      if (prox){
        var b1 = document.createElement('button');
        b1.className = 'bt verde'; b1.type = 'button';
        b1.textContent = 'Continuar →';
        b1.addEventListener('click', function(){ fechar(); setTimeout(function(){ abrir(prox); }, 180); });
        ac.appendChild(b1);
      }
      var b2 = document.createElement('button');
      b2.className = 'bt vazado'; b2.type = 'button';
      b2.textContent = 'Voltar ao mapa';
      b2.addEventListener('click', fechar);
      ac.appendChild(b2);
      $('#premio').classList.add('mostra');
      faiscas($('#premio'));
      setTimeout(function(){ $('#premio').scrollIntoView({behavior:'smooth', block:'nearest'}); }, 120);
    }

    // cada ponto: abrir, responder, acertar ou tentar de novo
    [].forEach.call(caixa.querySelectorAll('.passo'), function(passo, i){
      var p = a.pontos[i];
      var cab = passo.querySelector('.passo-cab');
      var dev = passo.querySelector('.devolutiva');
      var acoes = passo.querySelector('.acoes');
      var ops = [].slice.call(passo.querySelectorAll('.op'));

      cab.addEventListener('click', function(){ passo.classList.toggle('aberto'); });

      function limpar(){
        ops.forEach(function(o){ o.disabled = false; o.classList.remove('certa','errada'); });
        dev.className = 'devolutiva'; dev.innerHTML = '';
        acoes.innerHTML = '';
      }

      ops.forEach(function(op){
        op.addEventListener('click', function(){
          var certo = op.dataset.v === p.ok;
          ops.forEach(function(o){ o.disabled = true; });
          op.classList.add(certo ? 'certa' : 'errada');
          if (certo) ops.forEach(function(o){ if (o.dataset.v === p.ok) o.classList.add('certa'); });
          dev.className = 'devolutiva mostra ' + (certo ? 'boa' : 'quase');
          dev.innerHTML = '<b>'+(certo ? '✓ Isso mesmo' : 'Quase lá')+'</b>' + (certo ? p.porque : p.quase);
          acoes.innerHTML = '';
          if (certo){
            feitos[i] = true; pintarPassos(); passo.classList.add('ok');
            faiscas(op);
            var seg = a.pontos[i+1];
            if (seg){
              var c = document.createElement('button');
              c.className = 'bt'; c.type = 'button'; c.textContent = 'Continuar →';
              c.addEventListener('click', function(){
                passo.classList.remove('aberto');
                var pr = caixa.querySelectorAll('.passo')[i+1];
                pr.classList.add('aberto');
                pr.scrollIntoView({behavior:'smooth', block:'center'});
              });
              acoes.appendChild(c);
            }
          } else {
            var t = document.createElement('button');
            t.className = 'bt'; t.type = 'button'; t.textContent = '↻ Tentar novamente';
            t.addEventListener('click', limpar);
            acoes.appendChild(t);
            var e = document.createElement('button');
            e.className = 'bt vazado'; e.type = 'button'; e.textContent = 'Explorar de novo';
            e.addEventListener('click', function(){
              limpar();
              passo.querySelector('.fundo').scrollIntoView({behavior:'smooth', block:'center'});
            });
            acoes.appendChild(e);
          }
        });
      });
    });

    var itens = MIDIA[a.id];
    if (itens){
      [].forEach.call(caixa.querySelectorAll('.tira'), function(t){
        t.addEventListener('click', function(){ abrirVisor(itens[+t.dataset.m]); });
        // a miniatura de vídeo mostra o primeiro quadro ao passar o mouse
        var v = t.querySelector('video');
        if (v){
          t.addEventListener('mouseenter', function(){ v.play().catch(function(){}); });
          t.addEventListener('mouseleave', function(){ v.pause(); v.currentTime = 0; });
        }
      });
    }

    $('#x').addEventListener('click', fechar);
    $('#voltar').addEventListener('click', fechar);
    pintarPassos();
    if (vistos[a.id]) $('#qn').textContent = 'já concluída — refaça quando quiser';
  }

  function proxima(a){
    var i = TUDO.indexOf(a);
    return (i > -1 && i+1 < TUDO.length) ? TUDO[i+1] : null;
  }

  /* recompensa: poucas faíscas, rápido */
  function faiscas(alvo){
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var r = alvo.getBoundingClientRect();
    var cores = ['#FFC233','#6BCB4F','#F2682A','#0FB5BD','#8B4FB5'];
    for (var i=0;i<12;i++){
      (function(i){
        var d = document.createElement('span');
        d.className = 'faisca';
        d.style.background = cores[i % cores.length];
        d.style.left = (r.left + r.width/2) + 'px';
        d.style.top  = (r.top + r.height/2) + 'px';
        document.body.appendChild(d);
        var ang = (Math.PI * 2 * i) / 12 + Math.random()*.4;
        var dist = 46 + Math.random()*54;
        d.animate([
          {transform:'translate(-50%,-50%) scale(1) rotate(0deg)', opacity:1},
          {transform:'translate(calc(-50% + '+Math.cos(ang)*dist+'px), calc(-50% + '+Math.sin(ang)*dist+'px)) scale(.3) rotate(220deg)', opacity:0}
        ], {duration: 620 + Math.random()*260, easing:'cubic-bezier(.2,.7,.3,1)'});
        setTimeout(function(){ d.remove(); }, 920);
      })(i);
    }
  }


  /* ---------------- arquivo pessoal: galeria da aula ---------------- */
  function galeria(id){
    var itens = MIDIA[id];
    if (!itens || !itens.length) return '';
    var tiras = itens.map(function(m, i){
      var cam = m[0] === 'v'
        ? '<video src="midia/'+m[1]+'.mp4" muted playsinline preload="metadata"></video>'
          + '<span class="play"><i>▶</i></span><span class="selo">vídeo</span>'
        : '<img src="midia/'+m[1]+'.jpg" alt="">'
          + '<span class="play"></span><span class="selo">foto</span>';
      return '<button class="tira'+(m[0]==='f'?' foto':'')+'" type="button" data-m="'+i+'">'
           + '<span class="moldura">'+cam+'</span><p>'+m[2]+'</p></button>';
    }).join('');
    return '<div class="arquivo">'
         + '<div class="arquivo-cab"><span class="pt"></span><b>Do arquivo da Ana</b>'
         + '<span>· '+itens.length+' '+(itens.length>1?'registros':'registro')+' feitos no lugar</span></div>'
         + '<div class="tiras" id="tiras">'+tiras+'</div></div>';
  }

  var visor = $('#visor'), visorCaixa = $('#visorCaixa'), focoVisor = null;
  function abrirVisor(m){
    focoVisor = document.activeElement;
    var cam = m[0] === 'v'
      ? '<video src="midia/'+m[1]+'.mp4" controls autoplay playsinline></video>'
      : '<img src="midia/'+m[1]+'.jpg" alt="'+m[2].replace(/"/g,'')+'">';
    visorCaixa.innerHTML = cam
      + '<p class="leg">'+m[2]+'</p>'
      + '<p class="cred">'+CREDITO_PESSOAL+'</p>';
    visor.classList.add('abre');
    $('#visorX').focus();
  }
  function fecharVisor(){
    visor.classList.remove('abre');
    visorCaixa.innerHTML = '';
    if (focoVisor) focoVisor.focus();
  }
  $('#visorX').addEventListener('click', fecharVisor);
  visor.addEventListener('click', function(e){ if (e.target === visor) fecharVisor(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && visor.classList.contains('abre')){ e.stopPropagation(); fecharVisor(); }
  }, true);

  function fechar(){
    cortina.classList.remove('abre');
    document.body.style.overflow = '';
    caixa.innerHTML = '';
    if (ultimoFoco) ultimoFoco.focus();
  }
  cortina.addEventListener('click', function(e){ if (e.target === cortina) fechar(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && cortina.classList.contains('abre')) fechar(); });

  /* condor cruzando o céu, devagar */
  (function(){
    var c = document.getElementById('condor'), t = 0;
    if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    setInterval(function(){
      t += 0.012;
      var x = Math.sin(t) * 260, y = Math.sin(t*1.7) * 26;
      c.setAttribute('transform','translate('+x+','+y+')');
    }, 40);
  })();

  /* ---------------- a aventura começa: tudo entra em cena ---------------- */
  (function(){
    var parado = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // a trilha se desenha, como um caminho sendo traçado no mapa
    var t = document.getElementById('trilha');
    if (t && !parado){
      var L = t.getTotalLength();
      t.style.strokeDasharray = '2 22';
      t.style.strokeDashoffset = L;
      t.style.transition = 'stroke-dashoffset 2.6s cubic-bezier(.4,0,.2,1)';
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ t.style.strokeDashoffset = '0'; }); });
    }

    // as estações brotam uma a uma, subindo a montanha
    document.querySelectorAll('.estacao').forEach(function(e,i){
      if (parado) return;
      e.style.opacity = '0';
      e.style.transformBox = 'fill-box';
      e.style.transformOrigin = 'center';
      e.style.transform = 'scale(.4)';
      setTimeout(function(){
        e.style.transition = 'opacity .4s ease-out, transform .55s cubic-bezier(.34,1.6,.64,1)';
        e.style.opacity = '1'; e.style.transform = 'none';
      }, 420 + i*230);
    });

    // os pontos de curiosidade aparecem depois, já com a trilha pronta
    document.querySelectorAll('.curio').forEach(function(e,i){
      if (parado) return;
      e.style.opacity = '0';
      setTimeout(function(){
        e.style.transition = 'opacity .5s ease-out';
        e.style.opacity = '1';
      }, 2200 + i*140);
    });

    // os cartões de contexto deslizam para cima
    document.querySelectorAll('.mochila').forEach(function(e,i){
      if (parado) return;
      e.style.opacity = '0'; e.style.transform = 'translateY(16px)';
      setTimeout(function(){
        e.style.transition = 'opacity .5s ease-out, transform .5s cubic-bezier(.34,1.4,.64,1), border-color .18s, box-shadow .18s';
        e.style.opacity = '1'; e.style.transform = 'none';
      }, 120 + i*110);
    });

    // nuvens do céu atravessando devagar, cada uma na sua velocidade
    if (!parado){
      var nv = [].slice.call(document.querySelectorAll('.nuvemceu'));
      var tt = 0;
      setInterval(function(){
        tt += 1;
        nv.forEach(function(n,i){
          var v = parseFloat(n.getAttribute('data-v'));
          var x = ((tt * (v/34)) % 1500) - 250;
          n.setAttribute('transform','translate('+x+',0)');
        });
      }, 60);
    }
  })();


  /* ---------------- troca de temporada ---------------- */
  var CENA = {
    cl: {cena:'#cenaCL', base:CONTEXTO, trilha:TRILHA, tb:'🎒 Antes de subir', tt:'⛰️ A escalada',
         rod:'Toque nos <strong>ícones espalhados pela paisagem</strong> e descubra mais sobre o Chile!',
         eixo:['3.500 m','2.000 m','1.000 m']},
    ar: {cena:'#cenaAR', base:AR_CONTEXTO, trilha:AR_TRILHA, tb:'🎒 Antes de descer', tt:'⛷️ A descida',
         rod:'A descida começa em <strong>Valle Nevado</strong>, ao lado de onde o Chile terminou, e vai até o Río de la Plata. As paradas <strong>pontilhadas</strong> ainda não foram gravadas — o roteiro delas já está escrito.',
         eixo:['7.000 m','4.500 m','2.000 m']},
    uy: {cena:'#cenaUY', base:UY_CONTEXTO, trilha:UY_TRILHA, tb:'🎒 Antes de navegar', tt:'🌊 Onde o rio vira mar',
         rod:'A costa corre de oeste a leste e a <strong>água muda de cor</strong> no caminho: barro de rio em Colonia, azul de oceano em Punta del Este. Toque nos ícones para descobrir mais.',
         eixo:['costa','coxilhas','rio','mar']}
  };
  function trocar(t){
    if (t === TEMPORADA) return;
    TEMPORADA = t;
    var c = CENA[t];
    $('#cenaCL').style.display = t === 'cl' ? '' : 'none';
    $('#cenaAR').style.display = t === 'ar' ? '' : 'none';
    $('#cenaUY').style.display = t === 'uy' ? '' : 'none';
    $('#tit-base').textContent = c.tb;
    $('#tit-trilha').textContent = c.tt;
    $('#rodape').innerHTML = c.rod;
    var leg = document.querySelector('.legenda-alt');
    if (t === 'uy'){ leg.style.display = 'none'; }
    else {
      leg.style.display = '';
      if (c.eixo){ $('#alt1').textContent=c.eixo[0]; $('#alt2').textContent=c.eixo[1]; $('#alt3').textContent=c.eixo[2]; }
    }
    desenhaBase(c.base);
    TUDO = c.base.concat(c.trilha);
    pintarContador();
    [].forEach.call(document.querySelectorAll('.tmp'), function(b){
      b.setAttribute('aria-selected', b.dataset.t === t ? 'true' : 'false');
    });
    // os cartões entram com o mesmo movimento da abertura
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches){
      document.querySelectorAll('.mochila').forEach(function(e,i){
        e.style.opacity = '0'; e.style.transform = 'translateY(14px)';
        setTimeout(function(){
          e.style.transition = 'opacity .4s ease-out, transform .45s cubic-bezier(.34,1.4,.64,1), border-color .18s, box-shadow .18s';
          e.style.opacity = '1'; e.style.transform = 'none';
        }, 60 + i*90);
      });
    }
  }
  [].forEach.call(document.querySelectorAll('.tmp'), function(b){
    b.addEventListener('click', function(){ trocar(b.dataset.t); });
  });

  /* o veleiro na costa uruguaia */
  (function(){
    var v = document.getElementById('veleiro');
    if (!v || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var t = 0;
    setInterval(function(){
      t += 0.006;
      var u = (Math.sin(t) + 1) / 2;
      var x = 300 + u * 680, y = 560 + u * 54 + Math.sin(t*11) * 3;
      v.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+')');
    }, 40);
  })();

  /* o ferry atravessando o rio, devagar */
  (function(){
    var f = document.getElementById('ferry');
    if (!f || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var t = 0;
    setInterval(function(){
      t += 0.009;
      var u = (Math.sin(t) + 1) / 2;
      var x = 812 + u * 152, y = 538 + Math.sin(t*9) * 3 + Math.sin(t*9) * 3;
      f.setAttribute('transform','translate('+x.toFixed(1)+','+y.toFixed(1)+') scale('+(f.dataset.e||1)+')');
    }, 40);
  })();

  pintarContador();
})();
</script>
